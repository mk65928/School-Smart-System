    async function renderPeriodDisplay() {
      const content = document.getElementById("board-content");
      content.innerHTML = `<div class="board-empty"><span class="spin"></span> Loading today's routine…</div>`;
      const week = await storeGet(`routine:${state.classId}`, defaultWeek());
      const date = todayKey();
      const subs = await storeGet(`substitutions:${state.classId}:${date}`, {});
      const special = await storeGet(`specialPeriods:${state.classId}:${date}`, []);
      const absentNames = await getAbsentTeacherNames(date);
      const absentIds = await getAbsentTeacherIds(date);
      const dutyNames = await getDutyTeacherNames(date);
      const dutyIds = await getDutyTeacherIds(date);
      const exams = (await getExams()).filter(x => x.hallClassId === state.classId && x.date === date)
        .sort((a, b) => a.start.localeCompare(b.start));
      const dayIdx = new Date().getDay();
      const dayData = week[DAYS[dayIdx]] || { off: true, periods: [] };
      const mins = nowMinutes();

      // Multiple grades can share this hall on the same date, each with its own subject and
      // time — one banner, with one row per grade/subject rather than repeating the header.
      const examBanner = exams.length ? `
    <div class="exam-banner">
      <b>${ICON.exam} EXAM HALL TODAY</b>${exams.length > 1 ? ` <span style="opacity:.85;font-weight:600;font-size:12.5px;">(${exams.length} grades)</span>` : ""}
      ${exams.map(x => `<div class="exam-banner-row">${esc(x.gradeLabel)} · ${esc(x.subject)} · ${esc(x.start)}–${esc(x.end)}</div>`).join("")}
    </div>` : "";

      if (dayData.off && !exams.length) {
        content.innerHTML = `<div class="board-empty"><h2>No school today</h2><p style="color:var(--office-muted);">Enjoy the day off.</p></div>`;
        return;
      }

      const allPeriods = [...dayData.periods, ...special.map(sp => ({ ...sp, kind: "class", isSpecial: true }))]
        .sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));

      const classPeriods = allPeriods.filter(p => p.kind === "class" && !p.isSpecial);
      const rail = classPeriods.map(p => {
        const s = timeToMinutes(p.start), e = timeToMinutes(p.end);
        const st = computePeriodStatus(p, subs[p.id], absentNames, absentIds, dutyNames, dutyIds).status;
        let cls = "rail-bar ";
        if (mins >= s && mins < e) cls += "rail-now";
        else if (st === "empty") cls += "rail-sub";
        else if (mins >= e) cls += "rail-past";
        return `<div class="${cls}"></div>`;
      }).join("");

      // Only surface teachers who actually teach this class today — not the whole school.
      const teachersToday = [...new Set(classPeriods.flatMap(p => periodGroups(p).map(g => g.teacher)).filter(Boolean))];
      const staffStrip = teachersToday.length ? `
    <div class="staff-strip">
      ${teachersToday.map(name => {
        const key = name.trim().toLowerCase();
        const isAbsent = absentNames.has(key);
        const isDuty = !isAbsent && dutyNames.has(key);
        const dotClass = isAbsent ? 'absent' : isDuty ? 'duty' : 'present';
        const suffix = isAbsent ? ' (on leave)' : isDuty ? ' (on duty)' : '';
        return `<span class="staff-chip"><span class="staff-dot ${dotClass}"></span>${esc(name)}${suffix}</span>`;
      }).join("")}
    </div>` : "";

      const rows = allPeriods.map(p => {
        const s = timeToMinutes(p.start), e = timeToMinutes(p.end);
        const isNow = mins >= s && mins < e;
        const isPast = mins >= e;
        if (p.kind === "break") {
          return `<div class="period-row break-row ${isNow ? 'row-now' : isPast ? 'row-past' : ''}"><span class="row-time">${fmtTime(p.start)} – ${fmtTime(p.end)}</span><span>${esc(p.name)}</span></div>`;
        }
        if (p.isSpecial) {
          return `
        <div class="period-row status-special ${isNow ? 'row-now' : isPast ? 'row-past' : ''}">
          <span class="row-time">${fmtTime(p.start)} – ${fmtTime(p.end)}</span>
          <div style="flex:1;">
            <div class="row-name">${esc(p.name)} <span class="sub-badge b-special">SPECIAL</span></div>
            <div class="row-sub-detail">${esc(p.subject || "")} ${p.teacherName ? "· " + esc(p.teacherName) : ""}</div>
          </div>
          ${isNow ? `<span class="now-pill">NOW</span>` : ""}
        </div>`;
        }
        const sub = subs[p.id];
        const st = computePeriodStatus(p, sub, absentNames, absentIds, dutyNames, dutyIds);
        // For a split period that's otherwise running normally, quietly note if
        // one (but not both) of its two teachers is out — never a VACANT badge,
        // since the other group is still going ahead.
        const groupNote = (st.status === "normal" && p.split)
          ? periodGroupAvailability(p, absentIds, absentNames, dutyIds, dutyNames)
          : null;
        return `
      <div class="period-row status-${st.status} ${isNow ? 'row-now' : isPast ? 'row-past' : ''}">
        <span class="row-time">${fmtTime(p.start)} – ${fmtTime(p.end)}</span>
        <div style="flex:1;">
          <div class="row-name">${esc(p.name)}</div>
          ${st.status === "exchange" ? `
            <div class="sub-detail">
              <span class="sub-badge b-exchange">EXCHANGE</span>
              <span>${subGroupsHtml(sub, p)} <span style="color:var(--office-muted);">(exchanged with ${esc(periodTeachersLabel(p))})</span></span>
            </div>` : st.status === "substitute" ? `
            <div class="sub-detail">
              <span class="sub-badge b-substitute">SUBSTITUTE</span>
              <span>${subGroupsHtml(sub, p)} <span style="color:var(--office-muted);">(covering for ${esc(periodTeachersLabel(p))})</span></span>
            </div>` : st.status === "empty" ? `
            <div class="sub-detail">
              <span class="sub-badge b-empty">VACANT</span>
              <span style="color:var(--office-muted);">${periodGroups(p).map(g => `${esc(g.subject || "")} · ${esc(g.teacher || "—")}`).join(" + ")} ${st.reason === "duty" ? "is on duty elsewhere" : "is absent"} — no coverage assigned yet</span>
            </div>` : groupNote ? `
            <div class="row-sub-detail">${groupNote.map(g => `${esc(g.subject || "")} · ${esc(g.teacher || "—")}${g.reason ? ` <span style="color:var(--status-red);font-weight:700;">(${g.reason === "duty" ? "on duty" : "absent"})</span>` : ""}`).join(' &nbsp;+&nbsp; ')}</div>
            ` : `<div class="row-sub-detail">${periodSubjectTeacherHtml(p)}</div>`}
        </div>
        ${isNow ? `<span class="now-pill">NOW</span>` : ""}
      </div>`;
      }).join("");

      content.innerHTML = `<div class="period-display">${examBanner}${staffStrip}<div class="rail">${rail}</div>${rows}</div>`;

      clearTimeout(boardRefreshTimer);
      boardRefreshTimer = setTimeout(() => { if (state.boardTab === "period") renderPeriodDisplay(); }, 15000);
    }

    async function renderAttendanceScreen() {
      const content = document.getElementById("board-content");
      content.innerHTML = `<div class="attendance-screen"><div class="board-empty"><span class="spin"></span> Loading…</div></div>`;

      const date = todayKey();
      const week = await storeGet(`routine:${state.classId}`, defaultWeek());
      const subs = await storeGet(`substitutions:${state.classId}:${date}`, {});
      const special = await storeGet(`specialPeriods:${state.classId}:${date}`, []);
      const roster = await storeGet(`roster:${state.classId}`, []);
      const log = await storeGet(`attendance:${state.classId}:${date}`, []);
      const dayIdx = new Date().getDay();
      const dayData = week[DAYS[dayIdx]] || { off: true, periods: [] };
      const mins = nowMinutes();
      const regularCurrent = (dayData.periods || []).filter(p => p.kind === "class").find(p => mins >= timeToMinutes(p.start) && mins < timeToMinutes(p.end));
      const specialCurrent = !regularCurrent ? special.find(p => mins >= timeToMinutes(p.start) && mins < timeToMinutes(p.end)) : null;
      const current = regularCurrent || specialCurrent;
      const isSpecial = !regularCurrent && !!specialCurrent;
      const currentSub = (!isSpecial && current) ? subs[current.id] : null;
      const absentNames = await getAbsentTeacherNames(date);
      const absentIds = await getAbsentTeacherIds(date);
      const dutyNames = await getDutyTeacherNames(date);
      const dutyIds = await getDutyTeacherIds(date);
      const currentStatus = (!isSpecial && current) ? computePeriodStatus(current, currentSub, absentNames, absentIds, dutyNames, dutyIds) : null;

      content.innerHTML = `
    <div class="attendance-screen">
      <div class="current-strip">
        ${current ? `
          <b>${esc(current.name)}</b>
          ${isSpecial ? `<span class="sub-badge b-special">SPECIAL · ${esc(current.teacherName || "")}</span>` :
            currentStatus.status === "exchange" ? `<span class="sub-badge b-exchange">EXCHANGE · ${esc(currentSub.subTeacher)}</span>` :
              currentStatus.status === "substitute" ? `<span class="sub-badge b-substitute">SUBSTITUTE · ${esc(currentSub.subTeacher)}</span>` :
                currentStatus.status === "empty" ? `<span class="sub-badge b-empty">VACANT · ${esc(periodTeachersLabel(current))} ${currentStatus.reason === "duty" ? "on duty elsewhere" : "absent"}</span>` :
                  `<span style="color:var(--office-muted);">${periodSubjectTeacherHtml(current)}</span>`}
        ` : `<span style="color:var(--office-muted);">No class in session right now</span>`}
      </div>
      <div class="scan-panel" id="attn-panel"></div>
      <div class="scan-log">
        <div class="scan-log-head"><span>Checked in today</span><span>${log.length}</span></div>
        <div id="scan-log-list">
          ${log.length === 0 ? `<div style="color:var(--office-muted);font-size:13px;">No scans yet today.</div>` :
          log.slice().reverse().map(e => `<div class="scan-log-row"><span>${esc(e.name)} <span class="chip chip-muted">${e.method === 'id+face' ? 'ID + face' : e.method === 'id-only' ? 'ID only (no face on file)' : esc(e.method)}</span></span><span style="color:var(--office-muted);">${esc(e.periodName)} · ${new Date(e.timeMillis).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></div>`).join("")}
        </div>
      </div>
    </div>
  `;

      const isAlreadyMarked = (barcode) => !!log.find(e => e.barcode === barcode && e.periodId === (current ? current.id : "none"));

      async function recordAttendance(barcode, name, method, confidence) {
        const periodId = current ? current.id : "none";
        const periodName = current ? current.name : "Outside period";
        const already = log.find(e => e.barcode === barcode && e.periodId === periodId);
        if (already) return { ok: true, dup: true };
        const entry = { barcode, name, method, periodId, periodName, timeMillis: Date.now(), confidence: confidence || null };
        const newLog = [...log, entry];
        await storeSet(`attendance:${state.classId}:${date}`, newLog);
        renderAttendanceScreen();
        return { ok: true };
      }

      renderAttendancePanel(roster, recordAttendance, isAlreadyMarked);
    }

    /* ---- Attendance session panel — the camera stays off until a Student ID has
       been typed in and matched against the roster; only then does it switch on to
       verify that one student's face, then switch off again right after. ---- */
    let cameraVerifying = false;
    let pendingStudent = null;
    let attnFlashMessage = null;

    function endAttendanceSession() {
      stopCamera();
      cameraVerifying = false;
      pendingStudent = null;
      attnFlashMessage = null;
    }

    async function renderAttendancePanel(roster, recordAttendance, isAlreadyMarked) {
      const panel = document.getElementById("attn-panel");
      if (!panel) return;

      if (!humanReady && !humanError) {
        panel.innerHTML = `<div style="text-align:center;color:var(--office-muted);"><span class="spin"></span> Loading face recognition model — this can take a moment on the first run…</div>`;
        setTimeout(() => { if (state.boardTab === "attendance") renderAttendancePanel(roster, recordAttendance, isAlreadyMarked); }, 1200);
        return;
      }
      if (humanError) {
        panel.innerHTML = `<div style="text-align:center;"><div style="color:var(--red);margin-bottom:10px;">Face recognition couldn't load (${esc(humanError)}). Attendance requires both a Student ID and a live face check, so scanning is paused until this loads.</div><button class="btn btn-secondary" id="retry-human">Try again</button></div>`;
        document.getElementById("retry-human").onclick = () => { humanError = null; initHuman(); renderAttendancePanel(roster, recordAttendance, isAlreadyMarked); };
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        panel.innerHTML = `<div style="text-align:center;">This browser can't access a camera here — it usually needs the page loaded over <b>https://</b> (or opened directly as a local file, not inside an embedded preview).</div>`;
        return;
      }

      if (!cameraVerifying) {
        panel.innerHTML = `
      <div class="scan-idle">
        <div class="scan-idle-icon">${ICON.camera}</div>
        <div class="scan-idle-hint">The camera stays <b>off</b> until a Student ID is entered and matched. Enter it below to begin — the camera turns on only to verify that one student.</div>
        <div class="scan-row">
          <input class="scan-input" id="scan-input" placeholder="Enter Student ID" autofocus />
          <button class="scan-enter-btn" id="scan-enter-btn" title="Enter" aria-label="Enter">${ICON.enter}</button>
        </div>
        <div id="scan-flash"></div>
      </div>`;

        if (attnFlashMessage) {
          const flash = document.getElementById("scan-flash");
          if (flash) flash.innerHTML = attnFlashMessage;
          attnFlashMessage = null;
        }

        const input = document.getElementById("scan-input");
        input.focus();
        const refocus = setInterval(() => { const i = document.getElementById("scan-input"); if (i && state.boardTab === "attendance" && !cameraVerifying) i.focus(); else clearInterval(refocus); }, 2500);

        async function submitStudentId() {
          const code = input.value.trim();
          input.value = "";
          if (!code || cameraVerifying) return;
          const student = roster.find(s => s.barcode === code);
          const flash = document.getElementById("scan-flash");
          if (!student) {
            if (flash) flash.innerHTML = `<div class="flash-msg flash-fail">Unknown Student ID: ${esc(code)}</div>`;
            return;
          }
          if (isAlreadyMarked(student.barcode)) {
            if (flash) flash.innerHTML = `<div class="flash-msg flash-ok">${esc(student.name)} already marked present</div>`;
            return;
          }
          if (!student.faceDescriptor || !student.faceDescriptor.length) {
            if (flash) flash.innerHTML = `<div class="flash-msg flash-fail">${esc(student.name)} has no face on file — marking by Student ID only. Enroll their face from the office console.</div>`;
            await recordAttendance(student.barcode, student.name, "id-only");
            return;
          }
          // Student ID validated against the roster — only now does the camera turn on,
          // to verify this one student's face.
          if (flash) flash.innerHTML = `<div class="flash-msg flash-ok">ID matched ${esc(student.name)} — starting camera…</div>`;
          try {
            cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
            pendingStudent = student;
            cameraVerifying = true;
            renderAttendancePanel(roster, recordAttendance, isAlreadyMarked);
          } catch (e) {
            if (flash) flash.innerHTML = `<div class="flash-msg flash-fail">Camera access was denied, or no camera is available.</div>`;
            console.error("getUserMedia failed", e);
          }
        }

        input.onkeydown = (e) => { if (e.key === "Enter") submitStudentId(); };
        const enterBtn = document.getElementById("scan-enter-btn");
        if (enterBtn) enterBtn.onclick = () => { input.focus(); submitStudentId(); };
        return;
      }

      // A Student ID has already been validated — the camera is live to face-check that one
      // student only, and switches off again as soon as this settles.
      const student = pendingStudent;
      panel.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;">
      <div class="face-video-wrap" style="max-width:360px;"><video id="face-video" autoplay playsinline muted></video></div>
      <div id="scan-flash"></div>
      <div class="face-status" id="face-status">Verifying ${esc(student ? student.name : "")}… hold still for a moment</div>
      <button class="btn btn-ghost" id="cancel-verify">Cancel</button>
    </div>`;

      const video = document.getElementById("face-video");
      video.srcObject = cameraStream;
      await video.play().catch(() => { });
      await waitForVideoReady(video);

      const cancelBtn = document.getElementById("cancel-verify");
      if (cancelBtn) cancelBtn.onclick = () => {
        stopCamera();
        cameraVerifying = false;
        pendingStudent = null;
        renderAttendancePanel(roster, recordAttendance, isAlreadyMarked);
      };

      runVerification(student, recordAttendance, () => renderAttendancePanel(roster, recordAttendance, isAlreadyMarked));
    }

    // Verifies the live camera feed against ONLY this one already-ID-matched student's stored
    // face (1:1, not a search across the roster). Approves on face match alone, once the
    // detector's own anti-spoof score has cleared an obvious photo or screen. Whatever the
    // outcome — match, fail, or timeout — the camera is switched off immediately after via
    // onDone(), which returns the panel to the ID-entry (camera-off) state.
    async function runVerification(student, recordAttendance, onDone) {
      const deadline = Date.now() + MATCH_WINDOW_MS;
      let spoofChecked = false;
      const statusEl = () => document.getElementById("face-status");
      if (statusEl()) statusEl().textContent = `Verifying ${student.name}… hold still for a moment`;

      function stopAndReset() {
        stopCamera();
        cameraVerifying = false;
        pendingStudent = null;
      }

      async function tick() {
        if (!pendingStudent || pendingStudent.barcode !== student.barcode) return; // cancelled or superseded
        const video = document.getElementById("face-video");
        if (!video) { stopAndReset(); return; }
        if (Date.now() > deadline) {
          attnFlashMessage = `<div class="flash-msg flash-fail">Couldn't verify ${esc(student.name)} in time — enter the Student ID again to retry.</div>`;
          stopAndReset();
          onDone();
          return;
        }
        try {
          const f = await detectFaceFull(video);
          const st = statusEl();
          if (!f.hasFace) {
            if (st) st.textContent = "Can't see a face — center it in the frame";
          } else {
            // Fast-reject an obvious photo or screen before trusting the match.
            if (!spoofChecked && f.antispoofScore !== null && f.antispoofScore < ANTISPOOF_FAIL_THRESHOLD) {
              attnFlashMessage = `<div class="flash-msg flash-fail">That looked like a photo or screen, not a live face. Enter the Student ID again to retry.</div>`;
              stopAndReset();
              onDone();
              return;
            }
            spoofChecked = true;

            // 1:1 match — only against this one enrolled student, not the whole roster.
            // Approval happens on match alone, no movement/liveness challenge required.
            if (f.embedding) {
              const score = cosineSim(f.embedding, student.faceDescriptor);
              if (score >= FACE_THRESHOLD) {
                if (st) st.textContent = `Matched ${student.name}!`;
                stopAndReset();
                await recordAttendance(student.barcode, student.name, "id+face", score);
                return; // recordAttendance() triggers a full re-render, which restarts idle state
              }
            }
            if (st) st.textContent = `Verifying ${student.name}…`;
          }
        } catch (e) { console.error("verification error", e); }
        setTimeout(tick, 250);
      }
      tick();
    }


    /* ---- Teacher portal ---- */
    let teacherSubTab = "today";

    async function renderTeacherHome() {
      const content = document.getElementById("teacher-content");
      content.innerHTML = `
    <div class="teacher-subtabs">
      <button class="teacher-subtab ${teacherSubTab === 'today' ? 'active' : ''}" id="tsub-today">Today</button>
      <button class="teacher-subtab ${teacherSubTab === 'routine' ? 'active' : ''}" id="tsub-routine">My Routine (week)</button>
    </div>
    <div id="teacher-subcontent"><div class="board-empty" style="min-height:40vh;color:var(--office-muted);"><span class="spin"></span> Loading…</div></div>
  `;
      document.getElementById("tsub-today").onclick = () => { teacherSubTab = "today"; renderTeacherHome(); };
      document.getElementById("tsub-routine").onclick = () => { teacherSubTab = "routine"; renderTeacherHome(); };
      const sub = document.getElementById("teacher-subcontent");
      if (teacherSubTab === "today") renderTeacherToday(sub);
      else renderTeacherRoutine(sub);
    }

    function periodMatchesTeacher(period, teacher) {
      if (!period || !teacher) return false;
      return periodGroups(period).some(g =>
        (!!g.teacherId && g.teacherId === teacher.id) ||
        (!!g.teacher && g.teacher.trim().toLowerCase() === teacher.name.trim().toLowerCase())
      );
    }

    // Two time ranges (HH:MM strings) overlap if one starts before the other ends.
    function timesOverlap(aStart, aEnd, bStart, bEnd) {
      return timeToMinutes(aStart) < timeToMinutes(bEnd) && timeToMinutes(bStart) < timeToMinutes(aEnd);
    }

    // Every period today where this teacher is actually the one standing in the room:
    // their own periods that are still theirs (not given away), plus any period anywhere
    // they've been assigned to as a substitute or via an approved exchange. Used to stop a
    // teacher taking or exchanging into a period that overlaps something they're already doing.
    function teacherOccupiedIntervals(teacher, allToday) {
      return allToday.filter(x =>
        (periodMatchesTeacher(x.period, teacher) && x.status === "normal") ||
        (x.sub && x.sub.subTeacher === teacher.name)
      ).map(x => ({ start: x.period.start, end: x.period.end, periodId: x.period.id, periodName: x.period.name, className: x.className }));
    }
    // Returns the occupied interval that actually overlaps, so callers can tell the teacher
    // which of their periods is in the way — not just that a conflict exists.
    function findScheduleConflict(period, intervals, excludePeriodId) {
      return intervals.find(iv => iv.periodId !== excludePeriodId && timesOverlap(period.start, period.end, iv.start, iv.end)) || null;
    }
    function hasScheduleConflict(period, intervals, excludePeriodId) {
      return !!findScheduleConflict(period, intervals, excludePeriodId);
    }

    async function renderTeacherToday(content) {
      const date = todayKey();
      const dayIdx = new Date().getDay();
      const teacher = state.teacherAuth;
      const absentNames = await getAbsentTeacherNames(date);
      const absentIds = await getAbsentTeacherIds(date);
      const dutyNames = await getDutyTeacherNames(date);
      const dutyIds = await getDutyTeacherIds(date);
      const amIAbsent = absentIds.has(teacher.id) || absentNames.has(teacher.name.trim().toLowerCase());
      const amOnDuty = !amIAbsent && (dutyIds.has(teacher.id) || dutyNames.has(teacher.name.trim().toLowerCase()));

      // Gather every class period scheduled today, across the whole school, with its status.
      const allToday = [];
      for (const c of CLASSES) {
        const week = await storeGet(`routine:${c.id}`, defaultWeek());
        const subs = await storeGet(`substitutions:${c.id}:${date}`, {});
        const dayData = week[DAYS[dayIdx]] || { off: true, periods: [] };
        if (dayData.off) continue;
        // Special periods (exams, assemblies, etc.) live in a separate store and are never
        // merged in here, so they can't be picked up as a "take" or "exchange" target — this
        // filter is a second guard against that even if that ever changes.
        dayData.periods.filter(p => p.kind === "class" && !p.isSpecial).forEach(p => {
          const sub = subs[p.id];
          const st = computePeriodStatus(p, sub, absentNames, absentIds, dutyNames, dutyIds);
          allToday.push({ classId: c.id, className: c.label, period: p, sub, status: st.status, label: st.label, reason: st.reason });
        });
      }

      // A teacher may only take or exchange into a period that belongs to a classroom they
      // themselves teach in — if they only teach 11B, only 11B's periods are eligible.
      const teacherClassIds = await classesTaughtByTeacher(teacher.id);

      const rawEmpty = allToday.filter(x => x.status === "empty");
      const emptyPeriods = rawEmpty.filter(x => teacherClassIds.has(x.classId));

      const myPeriods = allToday.filter(x => periodMatchesTeacher(x.period, teacher));
      const requests = (await getRequests()).filter(r => r.teacherId === teacher.id).sort((a, b) => b.createdAt - a.createdAt).slice(0, 8);

      // Periods in the teacher's own classroom(s) that the office has already covered with a
      // substitute — surfaced here even when it isn't this teacher's own period.
      const subsInMyClasses = allToday.filter(x => teacherClassIds.has(x.classId) && x.status === "substitute" && !periodMatchesTeacher(x.period, teacher));

      const occupied = teacherOccupiedIntervals(teacher, allToday);

      content.innerHTML = `
    ${amIAbsent ? `<div class="flash-msg flash-fail" style="margin-bottom:16px;display:inline-block;">You're marked on leave today.</div>` :
          amOnDuty ? `<div class="flash-msg flash-fail" style="margin-bottom:16px;display:inline-block;">You're marked on duty today — your periods show as needing coverage.</div>` : ""}

    <div class="teacher-section-title">${ICON.swap} Empty periods you could cover <span style="color:var(--office-muted);font-weight:400;">(${emptyPeriods.length})</span></div>
    ${emptyPeriods.length === 0 ? `<div class="panel-empty">No uncovered periods in your classroom(s) right now.</div>` :
          emptyPeriods.map(x => {
            const conflict = findScheduleConflict(x.period, occupied, null);
            return `
        <div class="period-request-card status-empty">
          <div class="prc-main">
            <div class="prc-class">${esc(x.className)}</div>
            <div class="prc-name">${esc(x.period.name)} · ${periodGroups(x.period).map(g => esc(g.subject)).join(" + ")} <span class="sub-badge b-empty">VACANT</span></div>
            <div class="prc-detail">${fmtTime(x.period.start)}–${fmtTime(x.period.end)} · usually ${esc(periodTeachersLabel(x.period))} (${x.reason === "duty" ? "on duty elsewhere today" : "on leave today"})${conflict ? ` · you already have ${esc(conflict.periodName)} (${esc(conflict.className)}) at this time` : ""}</div>
          </div>
          <button class="btn ${(conflict || amIAbsent) ? 'btn-conflict' : 'btn-primary'}" ${(conflict || amIAbsent) ? "disabled" : ""} data-take="${x.classId}|${x.period.id}">${amIAbsent ? "Unavailable while on leave" : conflict ? "Time conflict" : "Request to take this period"}</button>
        </div>`;
          }).join("")
        }

    ${subsInMyClasses.length > 0 ? `
    <div class="teacher-section-title">Substitutes in your classroom(s) today <span style="color:var(--office-muted);font-weight:400;">(${subsInMyClasses.length})</span></div>
    ${subsInMyClasses.map(x => `
      <div class="period-request-card status-substitute">
        <div class="prc-main">
          <div class="prc-class">${esc(x.className)}</div>
          <div class="prc-name">${esc(x.period.name)} · ${esc(x.period.subject)} <span class="sub-badge b-substitute">SUBSTITUTE</span></div>
          <div class="prc-detail">${fmtTime(x.period.start)}–${fmtTime(x.period.end)} · covered by ${esc(x.sub.subTeacher || "—")} (usually ${esc(periodTeachersLabel(x.period))})</div>
        </div>
      </div>`).join("")}` : ""}

    <div class="teacher-section-title">Your periods today <span style="color:var(--office-muted);font-weight:400;">(${myPeriods.length})</span></div>
    ${myPeriods.length === 0 ? `<div class="panel-empty">You have no periods scheduled today.</div>` :
          myPeriods.map(x => {
            const myGroup = teacherGroupInPeriod(x.period, teacher);
            const coTeacher = x.period.split ? periodGroups(x.period).find(g => g.slot !== myGroup.slot) : null;
            return `
        <div class="period-request-card status-${x.status}">
          <div class="prc-main">
            <div class="prc-class">${esc(x.className)}</div>
            <div class="prc-name">${esc(x.period.name)} · ${esc(myGroup.subject)} <span class="sub-badge b-${x.status}">${x.label}</span></div>
            <div class="prc-detail">${fmtTime(x.period.start)}–${fmtTime(x.period.end)}${x.sub && x.sub.type === "exchange" ? ` · exchanged with ${esc(x.sub.subTeacher)} (${esc(x.sub.exchangeWith?.className || "")})` : x.sub ? ` · covered by ${esc(x.sub.subTeacher || "—")}` : ""}${coTeacher ? ` · split period, shared with ${esc(coTeacher.teacher || "—")}` : ""}</div>
          </div>
          ${(x.status === "normal" || x.status === "substitute" || x.status === "exchange") ? `<button class="btn ${amIAbsent ? 'btn-conflict' : 'btn-secondary'}" ${amIAbsent ? 'disabled' : ''} data-exchange="${x.classId}|${x.period.id}">${amIAbsent ? 'Unavailable while on leave' : 'Request exchange'}</button>` : ""}
        </div>`;
          }).join("")
        }

    <div class="teacher-section-title">Your requests</div>
    ${requests.length === 0 ? `<div class="panel-empty">You haven't made any requests yet.</div>` :
          requests.map(r => `
        <div class="request-row">
          <div class="request-row-head">
            <span class="request-status-pill ${r.status}">${r.status}</span>
            <b>${r.type === "take" ? "Take period" : "Exchange"}</b>
          </div>
          <div class="prc-detail" style="margin-top:4px;">
            ${r.type === "take"
              ? `${esc(r.targetClassName)} · ${esc(r.targetPeriodName)}`
              : `Your ${esc(r.myPeriodName)} (${esc(r.myClassName)}) ⇄ ${esc(r.targetTeacherName)}'s ${esc(r.targetPeriodName)} (${esc(r.targetClassName)})`}
          </div>
          <div class="request-actions">
            <button class="request-action-btn danger" data-remove-request="${r.id}">Remove request</button>
          </div>
        </div>`).join("")
        }
  `;

      document.querySelectorAll("[data-take]").forEach(btn => {
        btn.onclick = async () => {
          if (amIAbsent) {
            alert("Teachers marked absent cannot request coverage for vacant periods.");
            return;
          }
          const [classId, periodId] = btn.dataset.take.split("|");
          const item = emptyPeriods.find(x => x.classId === classId && x.period.id === periodId);
          if (!item) return;
          if (hasScheduleConflict(item.period, occupied, null)) return;
          const list = await getRequests();
          list.push({
            id: uid(), type: "take", status: "pending", createdAt: Date.now(), date,
            teacherId: teacher.id, teacherName: teacher.name,
            targetClassId: classId, targetClassName: item.className, targetPeriodId: periodId,
            targetPeriodName: item.period.name, targetSubject: item.period.subject,
          });
          await saveRequests(list);
          renderTeacherHome();
        };
      });

      document.querySelectorAll("[data-remove-request]").forEach(btn => {
        btn.onclick = async () => {
          const requestId = btn.dataset.removeRequest;
          if (!confirm("Remove this request?")) return;
          const list = await getRequests();
          const req = list.find(r => r.id === requestId && r.teacherId === teacher.id);
          if (!req) return;
          if (req.status === "approved") {
            alert("This request is already approved. The office must clear the resolved request.");
            return;
          }
          await removePeriodRequest(requestId);
          renderTeacherHome();
        };
      });

      document.querySelectorAll("[data-exchange]").forEach(btn => {
        btn.onclick = () => {
          if (amIAbsent) {
            alert("Teachers marked absent cannot request an exchange.");
            return;
          }
          const [classId, periodId] = btn.dataset.exchange.split("|");
          const mine = myPeriods.find(x => x.classId === classId && x.period.id === periodId);
          if (mine) openExchangePicker(mine, myPeriods, allToday, teacher, date, teacherClassIds, occupied);
        };
      });
    }

    // Full-week view of just this teacher's own periods, so they know where their next
    // period is today and can glance ahead at the rest of the week. Substitution/exchange
    // status is only meaningful for today's calendar date, so it's overlaid on today's row
    // only — other days show the plain recurring schedule.
    async function renderTeacherRoutine(content) {
      const teacher = state.teacherAuth;
      const date = todayKey();
      const todayIdx = new Date().getDay();
      const absentNames = await getAbsentTeacherNames(date);
      const absentIds = await getAbsentTeacherIds(date);
      const dutyNames = await getDutyTeacherNames(date);
      const dutyIds = await getDutyTeacherIds(date);
      const mins = nowMinutes();

      const byDay = {};
      DAYS.forEach(d => byDay[d] = []);
      for (const c of CLASSES) {
        const week = await storeGet(`routine:${c.id}`, defaultWeek());
        for (const d of DAYS) {
          const dd = week[d];
          if (!dd || dd.off) continue;
          dd.periods.filter(p => p.kind === "class" && periodMatchesTeacher(p, teacher)).forEach(p => {
            byDay[d].push({ className: c.label, classId: c.id, period: p });
          });
        }
      }
      Object.keys(byDay).forEach(d => byDay[d].sort((a, b) => timeToMinutes(a.period.start) - timeToMinutes(b.period.start)));

      const subsCache = {};
      async function subsFor(classId) {
        if (!subsCache[classId]) subsCache[classId] = await storeGet(`substitutions:${classId}:${date}`, {});
        return subsCache[classId];
      }

      let nextFound = false;
      const dayBlocks = [];
      for (const d of DAYS) {
        const isToday = DAYS[todayIdx] === d;
        const rows = [];
        for (const x of byDay[d]) {
          let badge = "";
          let isNext = false;
          if (isToday) {
            const sub = (await subsFor(x.classId))[x.period.id];
            const st = computePeriodStatus(x.period, sub, absentNames, absentIds, dutyNames, dutyIds);
            badge = `<span class="sub-badge b-${st.status}">${st.label}</span>`;
            if (!nextFound && timeToMinutes(x.period.start) >= mins) { isNext = true; nextFound = true; }
          }
          rows.push(`
        <div class="period-request-card status-${isToday ? "normal" : "normal"}" style="${isNext ? 'border-left-color:var(--amber);' : ''}">
          <div class="prc-main">
            <div class="prc-class">${esc(x.className)}${isNext ? ` <span class="sub-badge b-normal" style="background:var(--amber);color:#402c05;">NEXT UP</span>` : ""}</div>
            <div class="prc-name">${esc(x.period.name)} · ${esc(teacherGroupInPeriod(x.period, teacher).subject)} ${badge}</div>
            <div class="prc-detail">${fmtTime(x.period.start)}–${fmtTime(x.period.end)}</div>
          </div>
        </div>`);
        }
        dayBlocks.push(`
      <div class="teacher-section-title" style="${isToday ? 'color:var(--office-accent);' : ''}">${DAY_FULL[DAYS.indexOf(d)]}${isToday ? " (today)" : ""} <span style="color:var(--office-muted);font-weight:400;">(${byDay[d].length})</span></div>
      ${rows.length === 0 ? `<div class="panel-empty">No periods.</div>` : rows.join("")}
    `);
      }

      content.innerHTML = dayBlocks.join("");
    }

    // mine: the teacher's own period being offered up — fixed to whichever period the
    // teacher clicked "Request exchange" from (not re-selectable here). Targets are
    // restricted to periods in classrooms this teacher also teaches in, and can be a
    // normally-running period, one already covered by a substitute, or one already under
    // an exchange — any of those can still be swapped into. Periods that would overlap
    // something the teacher is already doing today (after giving up "mine"'s own slot) are
    // shown but disabled. The dropdown lists the other periods by period number/name only
    // (e.g. "1st Period") rather than by who currently teaches them, so the teacher is
    // choosing a slot in their day, not a person.
    function openExchangePicker(mine, myPeriods, allToday, teacher, date, teacherClassIds, occupied) {
      function othersFor(minePeriodId) {
        return allToday.filter(x =>
          (x.status === "normal" || x.status === "substitute" || x.status === "exchange") &&
          x.classId === mine.classId &&
          x.period.id !== minePeriodId
        );
      }
      function occupiedExcluding(minePeriodId) {
        return occupied.filter(iv => iv.periodId !== minePeriodId);
      }

      // Sort exchange targets by actual period time first, then classroom.
      // This prevents the list from appearing as "Period 2–10" for one class
      // followed by "Period 1–9" for another class simply because classes were
      // collected in CLASSES order.
      const others = othersFor(mine.period.id).sort((a, b) => {
        const timeDiff = timeToMinutes(a.period.start) - timeToMinutes(b.period.start);
        if (timeDiff !== 0) return timeDiff;
        const endDiff = timeToMinutes(a.period.end) - timeToMinutes(b.period.end);
        if (endDiff !== 0) return endDiff;
        return a.className.localeCompare(b.className);
      });
      const occ = occupiedExcluding(mine.period.id);

      const backdrop = document.createElement("div");
      backdrop.className = "modal-backdrop";
      backdrop.innerHTML = `
    <div class="modal-card">
      <h3 style="margin-top:0;">Request an exchange</h3>
      <p style="color:var(--office-muted);font-size:13px;">Requires office approval. You can exchange only with another period in ${esc(mine.className)}.</p>
      <label class="field-label">Your period</label>
      <div class="field-input" style="background:#F1ECDB;color:var(--office-muted);cursor:default;">${esc(mine.period.name)} · ${periodSubjectTeacherHtml(mine.period)} (${esc(mine.className)}, ${fmtTime(mine.period.start)})</div>
      ${mine.period.split ? `<p style="color:var(--office-muted);font-size:12px;margin:4px 0 0;">This period is split into two groups — both teachers move together to whichever period you exchange with.</p>` : ""}
      <label class="field-label">Exchange it for · ${esc(mine.className)}</label>
      <select class="field-input" id="exchange-target">
        <option value="">Choose a period…</option>
        ${others.map(x => {
        const conflict = findScheduleConflict(x.period, occ, null);
        return `<option value="${x.classId}|${x.period.id}" ${conflict ? "disabled" : ""}>${esc(x.period.name)} · ${esc(x.className)}${conflict ? ` — conflicts with your ${esc(conflict.periodName)} (${esc(conflict.className)})` : ""}</option>`;
      }).join("")}
      </select>
      <div id="exchange-target-empty" class="panel-empty" style="display:${others.length === 0 ? "block" : "none"};">No other periods in ${esc(mine.className)} are available to swap with today.</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="exchange-cancel">Cancel</button>
        <button class="btn btn-primary" id="exchange-submit" disabled>Send request</button>
      </div>
    </div>`;
      document.body.appendChild(backdrop);

      const targetSelect = document.getElementById("exchange-target");
      const submitBtn = document.getElementById("exchange-submit");
      if (others.length === 0) targetSelect.style.display = "none";

      targetSelect.onchange = () => { submitBtn.disabled = !targetSelect.value; };

      document.getElementById("exchange-cancel").onclick = () => backdrop.remove();
      submitBtn.onclick = async () => {
        if (await teacherIsAbsent(teacher.id, date)) {
          alert("Teachers marked absent cannot request an exchange.");
          return;
        }
        const val = targetSelect.value;
        if (!val) return;
        const [targetClassId, targetPeriodId] = val.split("|");
        const target = others.find(x => x.classId === targetClassId && x.period.id === targetPeriodId);
        if (!target) return;
        if (hasScheduleConflict(target.period, occ, null)) return;
        const list = await getRequests();
        list.push({
          id: uid(), type: "exchange", status: "pending", createdAt: Date.now(), date,
          teacherId: teacher.id, teacherName: teacher.name,
          myClassId: mine.classId, myClassName: mine.className, myPeriodId: mine.period.id, myPeriodName: mine.period.name,
          mySubject: periodGroups(mine.period).map(g => g.subject).join(" & "), myGroups: periodGroups(mine.period),
          targetTeacherId: target.period.teacherId || null, targetTeacherName: periodTeachersLabel(target.period), targetClassId: target.classId, targetClassName: target.className,
          targetPeriodId: target.period.id, targetPeriodName: target.period.name,
          targetSubject: periodGroups(target.period).map(g => g.subject).join(" & "), targetGroups: periodGroups(target.period),
        });
        await saveRequests(list);
        backdrop.remove();
        renderTeacherHome();
      };
    }

    function bindTeacher() {
      document.getElementById("teacher-exit").onclick = () => { state.teacherAuth = null; state.screen = "login"; render(); };
      const notice = document.getElementById("teacher-notice-btn");
      if (notice) notice.onclick = (e) => { e.stopPropagation(); toggleNoticePanel("staff", state.teacherAuth?.id); };
      refreshNoticeDot("staff", "teacher-notice-dot", state.teacherAuth?.id);
      clearInterval(boardClockTimer);
      boardClockTimer = setInterval(() => {
        const el = document.getElementById("teacher-clock");
        if (el) el.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      }, 1000);
      renderTeacherHome();
    }

    /* ---- Office console ---- */
    function bindOffice() {
      document.querySelectorAll(".office-tab").forEach(btn => {
        btn.onclick = () => { state.officeTab = btn.dataset.tab; render(); };
      });
      document.getElementById("office-exit").onclick = () => { state.officeRole = null; state.screen = "login"; render(); };
      renderOfficeTab();
    }

    function renderOfficeTab() {
      const content = document.getElementById("office-content");
      if (state.officeTab === "routine") renderRoutineEditor(content);
      else if (state.officeTab === "subs") renderSubsEditor(content);
      else if (state.officeTab === "requests") renderRequestsPanel(content);
      else if (state.officeTab === "staff") renderStaffAttendancePanel(content);
      else if (state.officeTab === "log") renderLogViewer(content);
      else if (state.officeTab === "dashboard") renderDashboardPanel(content);
      else if (state.officeTab === "exam") renderExamPanel(content);
      else if (state.officeTab === "notices") renderNoticesPanel(content);
      else if (state.officeTab === "teachers") renderTeachersPanel(content);
      else if (state.officeTab === "students") renderStudentIdsPanel(content);
      else renderSettingsPanel(content);
    }

    /* ---- Weekly routine editor ---- */
    let routineDraft = null, routineDraftClassId = null, routineDay = DAYS[new Date().getDay()], routineClassId = CLASSES[0].id, routineTeachers = [];

    async function renderRoutineEditor(content) {
      routineTeachers = await getTeachers();
      if (routineDraftClassId !== routineClassId) {
        routineDraft = await storeGet(`routine:${routineClassId}`, defaultWeek());
        routineDraftClassId = routineClassId;
        DAYS.forEach(d => { if (routineDraft[d] && routineDraft[d].periods) renumberDefaultPeriods(routineDraft[d].periods); });
      }
      const dayData = routineDraft[routineDay] || { off: false, periods: [] };

      content.innerHTML = `
    <div style="margin-bottom:14px;"><label class="field-label">Class</label>
      <select class="class-picker" id="routine-class-select">
        ${CLASSES.map(c => `<option value="${c.id}" ${c.id === routineClassId ? "selected" : ""}>${c.label}</option>`).join("")}
      </select>
    </div>
    <div class="day-tabs">
      ${DAYS.map(d => {
        const dd = routineDraft[d] || { off: false, periods: [] };
        return `<div class="day-tab ${routineDay === d ? 'active' : ''}" data-day="${d}">
          <span class="day-tab-name">${d}</span><span class="day-tab-count">${dd.off ? 'Off' : dd.periods.filter(p => p.kind === 'class').length + ' periods'}</span>
        </div>`;
      }).join("")}
    </div>
    <div class="routine-toolbar">
      <label><input type="checkbox" id="day-off-toggle" ${dayData.off ? "checked" : ""} /> No school on ${DAY_FULL[DAYS.indexOf(routineDay)]}</label>
      <select class="field-input" id="copy-from-select" style="width:auto;">
        <option value="" disabled selected>Copy periods from…</option>
        ${DAYS.filter(d => d !== routineDay).map(d => `<option value="${d}">${d}</option>`).join("")}
      </select>
    </div>
    <div id="period-cards">${dayData.off ? "" : dayData.periods.map((p, i) => periodCardHtml(p, i, dayData.periods.length, routineTeachers)).join("")}</div>
    ${dayData.off ? "" : `
      <div style="display:flex;gap:8px;margin-top:4px;">
        <button class="btn btn-secondary" id="add-class-period">+ Add class period</button>
        <button class="btn btn-secondary" id="add-break">+ Add break</button>
      </div>`}
    <div class="save-bar"><span class="saved-msg" id="routine-saved-msg"></span><button class="btn btn-primary" id="save-week">Save whole week</button></div>
  `;

      document.getElementById("routine-class-select").onchange = (e) => { routineClassId = e.target.value; renderRoutineEditor(content); };
      document.querySelectorAll(".day-tab").forEach(el => {
        el.onclick = () => { syncPeriodCardsFromDom(); routineDay = el.dataset.day; renderRoutineEditor(content); };
      });
      document.getElementById("day-off-toggle").onchange = (e) => {
        routineDraft[routineDay] = { ...dayData, off: e.target.checked };
        renderRoutineEditor(content);
      };
      document.getElementById("copy-from-select").onchange = (e) => {
        if (!e.target.value) return;
        const src = routineDraft[e.target.value];
        routineDraft[routineDay] = { off: src.off, periods: src.periods.map(p => ({ ...p, id: uid() })) };
        renumberDefaultPeriods(routineDraft[routineDay].periods);
        renderRoutineEditor(content);
      };
      const addClassBtn = document.getElementById("add-class-period");
      if (addClassBtn) addClassBtn.onclick = () => {
        syncPeriodCardsFromDom();
        const list = routineDraft[routineDay].periods;
        const last = list[list.length - 1];
        const start = last ? last.end : "07:00";
        const end = addMinutes(start, 45);
        list.push({ id: uid(), kind: "class", name: "", subject: "", teacher: "", teacherId: null, split: false, subject2: "", teacher2: "", teacherId2: null, start, end });
        renumberDefaultPeriods(list);
        renderRoutineEditor(content);
      };
      const addBreakBtn = document.getElementById("add-break");
      if (addBreakBtn) addBreakBtn.onclick = () => {
        syncPeriodCardsFromDom();
        const list = routineDraft[routineDay].periods;
        const last = list[list.length - 1];
        const start = last ? last.end : "07:00";
        list.push({ id: uid(), kind: "break", name: "Break", subject: "", teacher: "", teacherId: null, start, end: addMinutes(start, 15) });
        renderRoutineEditor(content);
      };
      document.querySelectorAll("[data-move]").forEach(btn => {
        btn.onclick = () => {
          syncPeriodCardsFromDom();
          const list = routineDraft[routineDay].periods;
          const idx = Number(btn.dataset.idx); const dir = Number(btn.dataset.move);
          const swap = idx + dir;
          if (swap < 0 || swap >= list.length) return;
          [list[idx], list[swap]] = [list[swap], list[idx]];
          renumberDefaultPeriods(list);
          renderRoutineEditor(content);
        };
      });
      document.querySelectorAll("[data-remove]").forEach(btn => {
        btn.onclick = () => {
          syncPeriodCardsFromDom();
          routineDraft[routineDay].periods = routineDraft[routineDay].periods.filter(p => p.id !== btn.dataset.remove);
          renumberDefaultPeriods(routineDraft[routineDay].periods);
          renderRoutineEditor(content);
        };
      });
      document.querySelectorAll("[data-split]").forEach(chk => {
        chk.onchange = () => {
          syncPeriodCardsFromDom();
          const card = chk.closest(".period-card");
          const p = routineDraft[routineDay].periods.find(x => x.id === card.dataset.periodId);
          if (!p) return;
          p.split = chk.checked;
          if (p.split) {
            p.subject2 = p.subject2 || "";
            p.teacher2 = p.teacher2 || "";
            p.teacherId2 = p.teacherId2 || null;
          }
          renderRoutineEditor(content);
        };
      });
      document.getElementById("save-week").onclick = async () => {
        syncPeriodCardsFromDom();
        await storeSet(`routine:${routineClassId}`, routineDraft);
        document.getElementById("routine-saved-msg").textContent = "Whole week saved.";
      };
    }

    // Keeps "Period N" labels in sync with actual position among class periods (breaks
    // don't count). Only touches names that are still on the default pattern or blank, so a
    // teacher/admin who has renamed a period (e.g. "Assembly") never gets overwritten. Called
    // after any add/remove/reorder so numbers can never drift, skip, or duplicate.
    function renumberDefaultPeriods(list) {
      let n = 0;
      list.forEach(p => {
        if (p.kind !== "class") return;
        n++;
        const isDefaultName = !p.name || /^period\s*\d+$/i.test(p.name.trim());
        if (isDefaultName) p.name = `Period ${n}`;
      });
    }

    // Teacher is picked from the Teachers tab's accounts rather than typed free text, so
    // absence/eligibility logic elsewhere can rely on a real id instead of a name string.
    function periodCardHtml(p, idx, total, teachers) {
      const split = p.kind === "class" && !!p.split;
      return `
    <div class="period-card" data-period-id="${p.id}">
      <div class="period-card-order">
        <button class="mini-btn" data-move="-1" data-idx="${idx}" ${idx === 0 ? "disabled" : ""}>${ICON.chevronUp}</button>
        <button class="mini-btn" data-move="1" data-idx="${idx}" ${idx === total - 1 ? "disabled" : ""}>${ICON.chevronDown}</button>
      </div>
      <div class="period-card-fields">
        <div class="field-row"><div class="field-col"><label>Name</label><input data-f="name" value="${esc(p.name)}" /></div>
          ${p.kind === "class" ? `
            <div class="field-col"><label>${split ? "Group A subject" : "Subject"}</label><input data-f="subject" value="${esc(p.subject)}" /></div>
            <div class="field-col"><label>${split ? "Group A teacher" : "Teacher"}</label>
              <select class="field-input" data-f="teacherId">
                <option value="">— Unassigned —</option>
                ${teachers.map(t => `<option value="${t.id}" ${p.teacherId === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("")}
              </select>
            </div>` : ""}
        </div>
        ${p.kind === "class" ? `
        <div class="field-row">
          <div class="field-col">
            <label style="display:flex;align-items:center;gap:6px;font-weight:600;">
              <input type="checkbox" data-split="1" ${split ? "checked" : ""} style="width:auto;" />
              Split this period into two groups (different subject &amp; teacher each)
            </label>
          </div>
        </div>
        ${split ? `
        <div class="field-row">
          <div class="field-col"><label>Group B subject</label><input data-f="subject2" value="${esc(p.subject2 || "")}" /></div>
          <div class="field-col"><label>Group B teacher</label>
            <select class="field-input" data-f="teacherId2">
              <option value="">— Unassigned —</option>
              ${teachers.map(t => `<option value="${t.id}" ${p.teacherId2 === t.id ? "selected" : ""}>${esc(t.name)}</option>`).join("")}
            </select>
          </div>
        </div>` : ""}` : ""}
        <div class="field-row">
          <div class="field-col field-col-time"><label>Start</label><input data-f="start" type="time" value="${p.start}" /></div>
          <div class="field-col field-col-time"><label>End</label><input data-f="end" type="time" value="${p.end}" /></div>
        </div>
      </div>
      <button class="mini-btn" style="color:var(--red);" data-remove="${p.id}">${ICON.close}</button>
    </div>`;
    }

    // Reads whatever's currently typed/selected in the period cards back into routineDraft
    // before any structural change, so in-progress edits aren't lost. Also resolves the
    // selected teacherId into a cached display name so free-text renders stay in sync.
    function syncPeriodCardsFromDom() {
      if (!routineDraft || !routineDraft[routineDay]) return;
      const list = routineDraft[routineDay].periods;
      document.querySelectorAll(".period-card").forEach(card => {
        const id = card.dataset.periodId;
        const p = list.find(x => x.id === id);
        if (!p) return;
        card.querySelectorAll("[data-f]").forEach(inp => { p[inp.dataset.f] = inp.value; });
        if (p.hasOwnProperty("teacherId")) {
          const t = routineTeachers.find(t => t.id === p.teacherId);
          p.teacher = t ? t.name : (p.teacherId ? p.teacher : "");
          if (!p.teacherId) p.teacherId = null;
        }
        if (p.split) {
          const t2 = routineTeachers.find(t => t.id === p.teacherId2);
          p.teacher2 = t2 ? t2.name : (p.teacherId2 ? p.teacher2 : "");
          if (!p.teacherId2) p.teacherId2 = null;
        }
      });
    }

    function addMinutes(hhmm, add) {
      const [h, m] = hhmm.split(":").map(Number);
      const total = h * 60 + m + add;
      return `${String(Math.floor(total / 60) % 24).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
    }

    /* ---- Substitutions editor ---- */
    let subsDraft = null, subsDraftKey = null, subsDate = todayKey(), subsClassId = CLASSES[0].id;

    let specialDraft = [], specialDraftKey = null;

    async function renderSubsEditor(content) {
      const key = subsClassId + "|" + subsDate;
      if (subsDraftKey !== key) {
        subsDraft = await storeGet(`substitutions:${subsClassId}:${subsDate}`, {});
        subsDraftKey = key;
      }
      if (specialDraftKey !== key) {
        specialDraft = await storeGet(`specialPeriods:${subsClassId}:${subsDate}`, []);
        specialDraftKey = key;
      }
      const week = await storeGet(`routine:${subsClassId}`, defaultWeek());
      const dayIdx = dayIndexFor(subsDate);
      const dayData = week[DAYS[dayIdx]] || { off: true, periods: [] };
      const classPeriods = dayData.off ? [] : dayData.periods.filter(p => p.kind === "class");
      const absentNames = await getAbsentTeacherNames(subsDate);
      const absentIds = await getAbsentTeacherIds(subsDate);
      const dutyNames = await getDutyTeacherNames(subsDate);
      const dutyIds = await getDutyTeacherIds(subsDate);
      const teachers = await getTeachers();
      const availableTeachers = teachers.filter(t => !absentIds.has(t.id) && !dutyIds.has(t.id));

      content.innerHTML = `
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;">
      <div><label class="field-label">Class</label>
        <select class="class-picker" id="subs-class-select">
          ${CLASSES.map(c => `<option value="${c.id}" ${c.id === subsClassId ? "selected" : ""}>${c.label}</option>`).join("")}
        </select>
      </div>
      <div><label class="field-label">Date</label>
        <input class="field-input" id="subs-date" type="date" value="${subsDate}" style="max-width:200px;" /></div>
    </div>
    ${dayData.off ? `<div class="panel-empty">No school on this date (${DAY_FULL[dayIdx]}).</div>` :
          classPeriods.length === 0 ? `<div class="panel-empty">No class periods set for ${DAY_FULL[dayIdx]} yet — add them in Weekly routine.</div>` :
            classPeriods.map(p => {
              const sub = subsDraft[p.id];
              const reason = unavailableReasonForPeriod(p, absentIds, absentNames, dutyIds, dutyNames);
              const isVacant = !!reason && !sub;
              return `
          <div class="subs-row ${sub ? 'active' : ''} ${isVacant ? 'vacant' : ''}" data-pid="${p.id}">
            <div class="subs-row-head">
              <span class="subs-time">${fmtTime(p.start)}</span><b>${esc(p.name)}</b>
              <span style="color:var(--office-muted);font-size:12px;">usually ${periodSubjectTeacherHtml(p)}</span>
              ${sub && sub.type === "exchange" ? `<span class="sub-badge b-exchange">EXCHANGE</span>` : sub ? `<span class="sub-badge b-substitute">SUBSTITUTE</span>` : isVacant ? `<span class="sub-badge b-empty">VACANT · teacher ${reason === "duty" ? "on duty" : "absent"}</span>` : ""}
            </div>
            ${sub ? `
              <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
                <select class="field-input" data-sf="subTeacher" style="flex:1;min-width:150px;">
                  <option value="">— Select substitute (available) —</option>
                  ${availableTeachers.map(t => `<option value="${esc(t.name)}" ${sub.subTeacher === t.name ? "selected" : ""}>${esc(t.name)}</option>`).join("")}
                </select>
                <input class="field-input" data-sf="subSubject" placeholder="Subject (optional)" value="${esc(sub.subSubject || "")}" style="flex:1;min-width:150px;" />
                <button class="btn btn-ghost" data-clear-sub="${p.id}">Remove</button>
              </div>
              ${availableTeachers.length === 0 ? `<div style="font-size:12px;color:var(--office-muted);margin-top:6px;">No available teachers.</div>` : ""}

    // Approving is what actually writes coverage into the relevant class's substitutions —
    // nothing shows as orange/yellow on any board until the office approves it here.
    async function resolveRequest(requestId, decision) {
      const list = await getRequests();
      const req = list.find(r => r.id === requestId);
      if (!req) return;
      req.status = decision;
      if (decision === "approved") {
        if (req.type === "take") {
          const subs = await storeGet(`substitutions:${req.targetClassId}:${req.date}`, {});
          subs[req.targetPeriodId] = { type: "substitute", subTeacher: req.teacherName, subSubject: "", requestId: req.id };
          await storeSet(`substitutions:${req.targetClassId}:${req.date}`, subs);
        } else if (req.type === "exchange") {
          // Snapshots taken when the request was made — for a split period this
          // holds BOTH teachers/subjects, so approving the exchange moves both
          // of them into the new slot together, not just the requesting teacher.
          const myGroups = (req.myGroups && req.myGroups.length) ? req.myGroups : [{ subject: req.mySubject, teacher: req.teacherName, teacherId: req.teacherId || null }];
          const targetGroups = (req.targetGroups && req.targetGroups.length) ? req.targetGroups : [{ subject: req.targetSubject, teacher: req.targetTeacherName, teacherId: req.targetTeacherId || null }];
          const mySubs = await storeGet(`substitutions:${req.myClassId}:${req.date}`, {});
          mySubs[req.myPeriodId] = {
            type: "exchange", groups: targetGroups, subTeacher: req.targetTeacherName, subSubject: req.targetSubject,
            exchangeWith: { classId: req.targetClassId, className: req.targetClassName, periodId: req.targetPeriodId, teacherName: req.targetTeacherName },
            requestId: req.id,
          };
          await storeSet(`substitutions:${req.myClassId}:${req.date}`, mySubs);
          const targetSubs = await storeGet(`substitutions:${req.targetClassId}:${req.date}`, {});
          targetSubs[req.targetPeriodId] = {
            type: "exchange", groups: myGroups, subTeacher: req.teacherName, subSubject: req.mySubject,
            exchangeWith: { classId: req.myClassId, className: req.myClassName, periodId: req.myPeriodId, teacherName: req.teacherName },
            requestId: req.id,
          };
          await storeSet(`substitutions:${req.targetClassId}:${req.date}`, targetSubs);
        }
      }
      await saveRequests(list);
    }

        } else {
          try {
            enrollStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
            const v = document.getElementById("enroll-video");
            v.srcObject = enrollStream;
            await v.play().catch(() => { });
            await waitForVideoReady(v);
          } catch (e) {
            document.getElementById("enroll-status").textContent = "Camera access was denied. Check the site's camera permission and try again.";

          }
        }
      }
      function cleanup() { if (enrollStream) enrollStream.getTracks().forEach(t => t.stop()); backdrop.remove(); }

        await storeSet(`roster:${classId}`, next);
        cleanup();
        onDone();

    // Reads an uploaded image file, downsizes + compresses it in the browser, and resolves
    // to a compact data: URL so it fits comfortably inside the notices storage key.
    function readAndCompressImage(file, maxDim = 900, quality = 0.75) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) { reject(new Error("Not an image file.")); return; }
        const reader = new FileReader();
        reader.onerror = () => reject(reader.error || new Error("Couldn't read that file."));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("Couldn't decode that image."));
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              const scale = maxDim / Math.max(width, height);
              width = Math.round(width * scale);
              height = Math.round(height * scale);
            }
            const canvas = document.createElement("canvas");
            canvas.width = width; canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

          return;
        }
        const subject = document.getElementById("nt-subject").value.trim();
        const text = document.getElementById("nt-text").value.trim();
        const urlInputNow = document.getElementById("nt-image");
        if (urlInputNow) noticeDraft.imageUrl = urlInputNow.value;
        const imageUrl = (noticeDraft.imageUrl || "").trim();
        if (!subject) { alert("Please enter a notice subject."); return; }
        if (!text && !imageUrl) { alert("Please add notice text, an image, or both."); return; }
        const list = await getNotices();
        list.push({
          id: uid(), subject, text, imageUrl, audience,
          classIds: audience === "classroom" ? [...noticeDraft.classIds] : [],
          teacherIds: audience === "staff" ? [...noticeDraft.teacherIds] : [],
          createdAt: Date.now(),
        });
        await saveNotices(list);
        noticeDraft = { subject: "", text: "", imageUrl: "", audience: "all", classIds: [], teacherIds: [] };
        renderNoticesPanel(content);
      };
      document.querySelectorAll("[data-remove-notice]").forEach(btn => {
        btn.onclick = async () => {
          const list = (await getNotices()).filter(n => n.id !== btn.dataset.removeNotice);
          await saveNotices(list);
          renderNoticesPanel(content);
        };
      });
    }

    /* ---- Settings (Super Admin) — both office PINs ---- */
    async function renderSettingsPanel(content) {
      const codes = await getClassroomCodes();
      content.innerHTML = `
    <h3 style="margin-top:0;">Daily Admin PIN</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
      <input class="field-input" id="pin-daily-current" type="password" placeholder="Current" style="max-width:140px;" />
      <input class="field-input" id="pin-daily-next" type="password" placeholder="New PIN" style="max-width:140px;" />
      <button class="btn btn-primary" id="pin-daily-update">Update</button>
    </div>
    <div id="pin-daily-msg" style="margin-top:8px;font-size:13px;font-weight:600;"></div>

    <h3 style="margin-top:26px;">Super Admin PIN</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
      <input class="field-input" id="pin-super-current" type="password" placeholder="Current" style="max-width:140px;" />
      <input class="field-input" id="pin-super-next" type="password" placeholder="New PIN" style="max-width:140px;" />
      <button class="btn btn-primary" id="pin-super-update">Update</button>
    </div>
    <div id="pin-super-msg" style="margin-top:8px;font-size:13px;font-weight:600;"></div>

    <h3 style="margin-top:26px;">Classroom IDs</h3>
    <p style="color:var(--office-muted);font-size:12.5px;max-width:560px;margin-top:-6px;">Each classroom's ID is what a board must enter to finish setup for that room. Edit a code and press Save to change it.</p>
    <div class="roster-table">
      <div class="roster-table-head" style="grid-template-columns:1.4fr 1fr auto;"><span>Classroom</span><span>Classroom ID</span><span></span></div>
      ${CLASSES.map(c => `
        <div class="roster-table-row" style="grid-template-columns:1.4fr 1fr auto;" data-code-row="${c.id}">
          <span>${esc(c.label)}</span>
          <input class="field-input mono" id="code-input-${c.id}" value="${esc(codes[c.id])}" style="max-width:140px;" />
          <button class="btn btn-secondary" data-save-code="${c.id}">Save</button>
        </div>`).join("")}
    </div>
    <div id="code-msg" style="margin-top:8px;font-size:13px;font-weight:600;"></div>
  `;
      document.querySelectorAll("[data-save-code]").forEach(btn => {
        btn.onclick = async () => {
          const classId = btn.dataset.saveCode;
          const input = document.getElementById(`code-input-${classId}`);
          const msg = document.getElementById("code-msg");
          const next = input.value.trim();
          if (!next) { msg.textContent = "Classroom ID can't be empty."; msg.style.color = "var(--red)"; return; }
          const overrides = await storeGet("classroomCodes", {});
          const dupClass = CLASSES.find(c => c.id !== classId && (overrides[c.id] || defaultClassroomCode(c.id)) === next);
          if (dupClass) { msg.textContent = `That ID is already used by ${dupClass.label}.`; msg.style.color = "var(--red)"; return; }
          overrides[classId] = next;
          await storeSet("classroomCodes", overrides);
          msg.textContent = `Classroom ID updated for ${CLASSES.find(c => c.id === classId).label}.`; msg.style.color = "var(--green)";
        };
      });
      function wirePin(role, storageKey, fallback) {
        document.getElementById(`pin-${role}-update`).onclick = async () => {
          const cur = document.getElementById(`pin-${role}-current`).value;
          const next = document.getElementById(`pin-${role}-next`).value;
          const msg = document.getElementById(`pin-${role}-msg`);
          const real = await storeGet(storageKey, fallback);
          if (cur !== real) { msg.textContent = "Current PIN is incorrect."; msg.style.color = "var(--red)"; return; }
          if (next.trim().length < 4) { msg.textContent = "New PIN should be at least 4 digits."; msg.style.color = "var(--red)"; return; }
          await storeSet(storageKey, next.trim());
          msg.textContent = "PIN updated."; msg.style.color = "var(--green)";
          document.getElementById(`pin-${role}-current`).value = ""; document.getElementById(`pin-${role}-next`).value = "";
        };
      }
      wirePin("daily", "office-pin-daily", "1234");
      wirePin("super", "office-pin-super", "5678");
    }

    /* =========================================================================
       BOOT — login is always the first screen
    ========================================================================= */
    render();
  </script>

  <script id="password-preview-helper">
    function addPasswordPreview(input) {
      if (!input || input.dataset.previewReady === "1") return;
      input.dataset.previewReady = "1";
      const wrap = document.createElement("div");
      wrap.className = "password-preview-wrap";
      wrap.style.cssText = "position:relative;display:flex;align-items:center;";
      input.parentNode.insertBefore(wrap, input);
      wrap.appendChild(input);
      input.style.paddingRight = "50px";

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "password-preview-toggle";
      btn.style.cssText = "position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;padding:4px;font-size:12px;color:var(--office-muted);";
      btn.title = "Show password";
      btn.setAttribute("aria-label", "Show password");
      btn.textContent = "Show";
      btn.onclick = () => {
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        btn.textContent = showing ? "Show" : "Hide";
        btn.title = showing ? "Show password" : "Hide password";
        btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      };
      wrap.appendChild(btn);
    }
    function enablePasswordPreviews(root = document) {
      root.querySelectorAll('input[type="password"]').forEach(addPasswordPreview);
    }
    document.addEventListener("DOMContentLoaded", () => enablePasswordPreviews());
  </script>
  <script id="password-preview-observer">
    (function () {
      const observer = new MutationObserver(() => enablePasswordPreviews(document));
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>

</body>

</html>
