<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samavira</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/human/3.3.6/human.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

    :root {
      --ink-navy: #141B31;
      --ink-panel: #1D2846;
      --ink-panel-2: #28345C;
      --amber: #F5A93F;
      --red: #E2554A;
      --green: #3FBE85;
      --off-white: #EEF0F7;
      --muted: #8E97BC;
      --teal: #33B7C6;
      --violet: #8C7CF0;
      --office-bg: #FBF7EE;
      --office-panel: #FFFFFF;
      --office-ink: #20263D;
      --office-border: #E9E1CC;
      --office-muted: #928A6C;
      --office-accent: #D9662B;
      --office-accent-2: #2E8B6E;
      /* period coverage status colors — used identically across teacher, classroom board, and office */
      --status-green: #3FBE85;
      --status-yellow: #EFC94C;
      --status-orange: #E88A3A;
      --status-red: #E2554A;
      --status-special: #33B7C6;
      --font-display: 'Baloo 2', system-ui, sans-serif;
      --font-body: 'Manrope', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: var(--font-body);
      background: var(--office-bg);
      color: var(--office-ink);
    }

    h1,
    h2,
    h3 {
      font-family: var(--font-display);
    }

    #app {
      min-height: 100vh;
    }

    .spin {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(138, 147, 179, .35);
      border-top-color: var(--office-muted);
      display: inline-block;
      animation: spin .7s linear infinite;
      vertical-align: -3px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: -3px;
    }

    /* ---- Startup splash ---- */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: radial-gradient(circle at 30% 22%, #2C3866 0%, var(--ink-navy) 55%, #0C1022 100%);
      overflow: hidden;
      transition: opacity .55s ease, visibility .55s ease;
    }

    #splash.splash-hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-glow {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 169, 63, .22) 0%, transparent 70%);
      animation: splash-breathe 3.2s ease-in-out infinite;
    }

    .splash-badge {
      position: relative;
      width: 112px;
      height: 112px;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 22px 50px rgba(0, 0, 0, .5), 0 0 0 6px rgba(245, 169, 63, .14);
      animation: splash-pop .75s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    .splash-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .splash-title {
      position: relative;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 36px;
      letter-spacing: .02em;
      color: #fff;
      opacity: 0;
      animation: splash-rise .7s ease .3s forwards;
    }

    .splash-sub {
      position: relative;
      font: 800 11px/1 var(--font-mono);
      letter-spacing: .34em;
      text-transform: uppercase;
      color: var(--amber);
      opacity: 0;
      animation: splash-rise .7s ease .5s forwards;
    }

    .splash-bar {
      position: relative;
      width: 130px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, .14);
      overflow: hidden;
      margin-top: 8px;
      opacity: 0;
      animation: splash-rise .5s ease .7s forwards;
    }

    .splash-bar span {
      display: block;
      height: 100%;
      width: 36%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--amber), var(--office-accent));
      animation: splash-load 1.3s ease-in-out infinite;
    }

    @keyframes splash-pop {
      0% {
        transform: scale(.4) rotate(-10deg);
        opacity: 0;
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1;
      }
    }

    @keyframes splash-rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes splash-load {
      0% {
        transform: translateX(-130%);
      }

      100% {
        transform: translateX(360%);
      }
    }

    @keyframes splash-breathe {

      0%,
      100% {
        transform: scale(1);
        opacity: .7;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    .paper-texture {
      background-image: radial-gradient(rgba(32, 38, 61, .05) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .notice-badge {
      position: relative;
    }

    .notice-dot {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--red);
      border: 2px solid var(--ink-navy);
    }

    .notice-dot.on-light {
      border-color: var(--office-panel);
    }

    .notice-panel {
      position: absolute;
      top: 46px;
      right: 14px;
      width: 300px;
      max-height: 360px;
      overflow-y: auto;
      background: var(--office-panel);
      color: var(--office-ink);
      border-radius: 14px;
      box-shadow: 0 14px 40px rgba(20, 27, 49, .35);
      padding: 14px;
      z-index: 60;
    }

    .notice-item {
      border-bottom: 1px solid var(--office-border);
      padding: 10px 0;
    }

    .notice-item.notice-clickable {
      cursor: pointer;
      border-radius: 10px;
      padding: 10px;
      transition: background .12s ease, transform .12s ease;
    }

    .notice-item.notice-clickable:hover {
      background: #FBF7EE;
      transform: translateY(-1px);
    }

    .notice-subject {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
      color: var(--office-ink);
    }

    .notice-preview {
      font-size: 11px;
      color: var(--office-muted);
      margin-top: 3px;
    }

    .notice-item:last-child {
      border-bottom: none;
    }

    .notice-audience {
      font: 800 9px/1 var(--font-mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--office-accent-2);
    }

    .notice-text {
      font-size: 13px;
      margin-top: 4px;
      line-height: 1.5;
    }

    .notice-img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 6px;
    }

    /* ---- Login ---- */
    .login-screen {
      max-width: 460px;
      margin: 0 auto;
      padding: 64px 24px;
      text-align: center;
      position: relative;
    }

    .login-badge {
      width: 110px;
      height: 110px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--office-accent), var(--amber));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 10px 24px rgba(217, 102, 43, .28);
      overflow: hidden;
    }

    .login-badge svg {
      width: 32px;
      height: 32px;
      stroke: #fff;
      fill: none;
      stroke-width: 1.8;
    }

    .login-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .login-eyebrow {
      font: 800 11px/1 var(--font-mono);
      letter-spacing: .16em;
      color: var(--office-accent);
      margin-bottom: 10px;
    }

    .login-title {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 700;
      margin: 0 0 26px;
      letter-spacing: -0.01em;
    }

    .login-cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-card {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      background: var(--office-panel);
      border: 1px solid var(--office-border);
      border-radius: 16px;
      padding: 18px 20px;
      cursor: pointer;
      font: inherit;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      box-shadow: 0 2px 0 var(--office-border);
    }

    .login-card:hover {
      border-color: var(--office-accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(217, 102, 43, .14);
    }

    .login-card b {
      display: block;
      font-family: var(--font-display);
      font-size: 16px;
    }

    .login-card span {
      font-size: 12.5px;
      color: var(--office-muted);
    }

    .login-card-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .login-card-icon svg {
      width: 20px;
      height: 20px;
      stroke: #fff;
      fill: none;
      stroke-width: 1.8;
    }

    .pin-box {
      max-width: 280px;
      margin: 20px auto 0;
    }

    .pin-input {
      width: 100%;
      text-align: center;
      letter-spacing: .35em;
      font-family: var(--font-mono);
      font-size: 22px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--office-border);
    }

    .login-error {
      color: var(--red);
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
    }

    .login-hint {
      font-size: 11px;
      color: var(--office-muted);
      margin-top: 20px;
    }

    /* ---- shared buttons/fields ---- */
    .btn {
      border: none;
      border-radius: 11px;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 13px;
      padding: 11px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform .1s ease, box-shadow .15s ease, opacity .15s ease;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn-primary {
      background: var(--office-accent);
      color: #fff;
      box-shadow: 0 3px 0 #A34E1E;
    }

    .btn-primary:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-conflict,
    .btn-conflict:hover {
      background: #C7C2B0 !important;
      color: #6F6A56 !important;
      box-shadow: none !important;
      cursor: not-allowed !important;
      opacity: 1;
    }

    .search-row {
      margin-bottom: 10px;
      max-width: 320px;
    }

    .btn-secondary {
      background: #F1ECDB;
      color: var(--office-ink);
    }

    .btn-secondary:hover {
      background: #E9E2CB;
    }

    .btn-ghost {
      background: transparent;
      color: var(--office-muted);
    }

    .btn-ghost:hover {
      color: var(--office-ink);
    }

    .btn-danger {
      background: transparent;
      color: var(--red);
    }

    .btn-danger:hover {
      background: rgba(226, 85, 74, .08);
    }

    .btn-block {
      width: 100%;
      justify-content: center;
      margin-top: 10px;
    }

    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      color: var(--office-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin: 10px 0 4px;
    }

    .field-input {
      width: 100%;
      padding: 10px 13px;
      border-radius: 10px;
      border: 1.5px solid var(--office-border);
      font-size: 13px;
      background: #fff;
      color: var(--office-ink);
      font-family: inherit;
      box-shadow: 0 1px 2px rgba(32, 38, 61, .04);
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .field-input:hover {
      border-color: #D3C7A3;
    }

    .field-input:focus {
      outline: none;
      border-color: var(--office-accent);
      box-shadow: 0 0 0 3px rgba(217, 102, 43, .15);
    }

    .field-input::placeholder {
      color: #B7AF95;
    }

    select.field-input,
    select.class-picker {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      cursor: pointer;
      padding-right: 34px;
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 15px;
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%23928A6C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='5 8 10 13 15 8'/%3E%3C/svg%3E");
    }

    select.field-input,
    select.class-picker {
      font-weight: 700;
      background-color: #fff;
    }

    select.field-input:hover,
    select.class-picker:hover {
      border-color: var(--office-accent);
      box-shadow: 0 4px 10px rgba(217, 102, 43, .14);
      transform: translateY(-1px);
    }

    select.field-input:focus,
    select.class-picker:focus {
      transform: translateY(-1px);
    }

    /* ---- Segmented pill control (cooler replacement for plain <select> option groups) ---- */
    .seg-group {
      display: flex;
      gap: 5px;
      padding: 5px;
      background: #F1ECDB;
      border: 1.5px solid var(--office-border);
      border-radius: 13px;
    }

    .seg-option {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--office-muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: background .15s ease, color .15s ease, box-shadow .15s ease, transform .1s ease;
    }

    .seg-option svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .seg-option input {
      display: none;
    }

    .seg-option:hover {
      color: var(--office-ink);
    }

    .seg-option.active {
      background: linear-gradient(135deg, var(--office-accent), var(--amber));
      color: #fff;
      box-shadow: 0 4px 10px rgba(217, 102, 43, .3);
    }

    .seg-option.active:hover {
      color: #fff;
    }

    .seg-option:active {
      transform: scale(.97);
    }

    /* ---- Notice image upload ---- */
    .image-upload-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1.5px dashed #D3C7A3;
      background: #FAFAF6;
      color: var(--office-muted);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color .15s ease, color .15s ease, background .15s ease;
    }

    .upload-btn:hover {
      border-color: var(--office-accent);
      color: var(--office-accent);
      background: #FFF6EE;
    }

    .upload-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .image-preview {
      position: relative;
      display: inline-flex;
      margin-top: 2px;
    }

    .image-preview img {
      max-width: 170px;
      max-height: 120px;
      border-radius: 10px;
      border: 1.5px solid var(--office-border);
      display: block;
      object-fit: cover;
    }

    .image-preview-remove {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      border: 2px solid #fff;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .22);
      padding: 0;
    }

    .image-preview-remove svg {
      width: 12px !important;
      height: 12px !important;
      stroke-width: 2.4;
    }

    .image-upload-hint {
      font-size: 11px;
      color: var(--office-muted);
      margin-top: 6px;
    }

    /* ---- Multi-select chip picker (grades, teachers) ---- */
    .picker-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      max-height: 190px;
      overflow-y: auto;
      padding: 10px;
      border: 1.5px solid var(--office-border);
      border-radius: 10px;
      background: #FAFAF6;
    }

    .picker-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--office-border);
      background: #fff;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--office-ink);
      cursor: pointer;
      user-select: none;
      transition: border-color .12s ease, background .12s ease, color .12s ease;
    }

    .picker-chip:hover {
      border-color: var(--office-accent);
    }

    .picker-chip input {
      display: none;
    }

    .picker-chip.checked {
      background: var(--office-accent);
      border-color: var(--office-accent);
      color: #fff;
    }

    .picker-hint {
      font-size: 11.5px;
      color: var(--office-muted);
      margin-top: 6px;
    }

    .picker-empty {
      font-size: 12.5px;
      color: var(--office-muted);
      padding: 4px 2px;
    }

    /* ---- Board shell — restyled to match the office theme, with its own
     accent flourishes (gradient header, glass chips, soft depth) ---- */
    .board-shell {
      background: var(--office-bg);
      color: var(--office-ink);
      min-height: 100vh;
      background-image: radial-gradient(rgba(32, 38, 61, .05) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .board-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: linear-gradient(120deg, #232C52, #2E3A6E 55%, #3A2C5E);
      color: #fff;
      box-shadow: 0 6px 18px rgba(35, 44, 82, .18);
      position: relative;
      z-index: 2;
    }

    .board-class-name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 9px;
      letter-spacing: .01em;
    }

    .board-class-name::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 4px rgba(245, 169, 63, .25);
      flex-shrink: 0;
    }

    .board-tabs {
      display: flex;
      gap: 4px;
      margin-left: auto;
      background: rgba(255, 255, 255, .1);
      padding: 4px;
      border-radius: 12px;
    }

    .board-tab {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, .72);
      padding: 8px 16px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }

    .board-tab:hover {
      color: #fff;
    }

    .board-tab.active {
      background: linear-gradient(135deg, var(--amber), #F0C169);
      color: #201404;
      box-shadow: 0 3px 10px rgba(245, 169, 63, .35);
    }

    .board-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .board-clock {
      font: 700 14px/1 var(--font-mono);
      margin-right: 2px;
      background: rgba(255, 255, 255, .12);
      padding: 8px 11px;
      border-radius: 9px;
      letter-spacing: .02em;
    }

    .icon-btn {
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .16);
      color: rgba(255, 255, 255, .85);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .15s ease, transform .1s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, .2);
      color: #fff;
      transform: translateY(-1px);
    }

    .board-setup {
      max-width: 380px;
      margin: 0 auto;
      padding: 72px 24px;
      text-align: center;
    }

    /* ---- Period display ---- */
    .period-display {
      padding: 22px 30px 40px;
      max-width: 900px;
      margin: 0 auto;
    }

    .rail {
      display: flex;
      gap: 5px;
      margin-bottom: 24px;
    }

    .rail-bar {
      height: 8px;
      flex: 1;
      border-radius: 4px;
      background: var(--office-border);
    }

    .rail-now {
      background: var(--office-accent);
    }

    .rail-past {
      background: #D9CFB0;
    }

    .rail-sub {

    .period-row {

    .period-request-card.status-exchange {

      color: var(--office-ink);

      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;

      border-color: var(--office-accent);
      background: #FFF7EE;
    }

    .request-action-btn.danger {
      color: var(--red);
    }

    .request-action-btn.danger:hover {
      border-color: var(--red);
      background: #FDF2F1;
    }

    .exchange-picker {
      background: #FAFAF6;
      border: 1px solid var(--office-border);
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;

    /* ---- Attendance — light theme, camera turns on only after ID validation ---- */

      border-color: var(--office-accent);
    }

      box-shadow: 0 2px 8px rgba(32, 38, 61, .05);

      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .scan-idle-icon {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #F1ECDB, #FBF7EE);

      align-items: center;
      justify-content: center;
      color: var(--office-muted);
      box-shadow: inset 0 0 0 1.5px var(--office-border);

      width: 26px;
      height: 26px;

    .scan-idle-hint {
      color: var(--office-muted);
      font-size: 12.5px;
      text-align: center;

      line-height: 1.5;

      width: 100%;
      max-width: 400px;
      text-align: center;
      background: #fff;
      border: 1.5px solid var(--office-border);
      color: var(--office-ink);

      border-radius: 10px;
      font-size: 15px;
      transition: border-color .15s ease, box-shadow .15s ease;

      border-color: var(--office-accent);
      box-shadow: 0 0 0 3px rgba(217, 102, 43, .15);

      max-width: 360px;

    .scan-row .scan-input {

      flex: 1;

    .scan-enter-btn {
      flex-shrink: 0;
      width: 46px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--office-accent), var(--amber));

      align-items: center;

    .flash-msg {

    }

    .flash-fail {

    .scan-log {

    .scan-log-head {

      font-size: 12px;

    .face-video-wrap video {
      width: 100%;

      transform: scaleX(-1);

    .face-status {
      font-size: 13px;
      margin-top: 8px;
      color: var(--office-muted);
      text-align: center;
    }

    /* ---- Office ---- */
    .office-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 24px;
      background: var(--office-panel);
      border-bottom: 1px solid var(--office-border);

    .office-header b {
      font-family: var(--font-display);
      font-weight: 700;

    .class-picker {

      border-radius: 10px;

      font-weight: 700;
      background: #fff;
      box-shadow: 0 1px 2px rgba(32, 38, 61, .04);
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .class-picker:hover {
      border-color: #D3C7A3;
    }

    .class-picker:focus {
      outline: none;
      border-color: var(--office-accent);
      box-shadow: 0 0 0 3px rgba(217, 102, 43, .15);
    }

    .office-header-right {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .office-tabs {
      display: flex;
      gap: 4px;

    .office-tab {

    .role-badge {

    .day-tab.active {
      border-color: var(--office-accent);
      background: #FBF0E4;
    }

    .day-tab-name {
      font-weight: 700;
      font-size: 13px;
      display: block;
    }

    .day-tab-count {
      font-size: 10px;
      color: var(--office-muted);

    .routine-toolbar {

      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 13px;
    }

    .period-card {

    .mini-btn svg {

      border-color: var(--office-accent);

      border-color: var(--office-accent);
      box-shadow: 0 0 0 3px rgba(217, 102, 43, .15);
    }

    .field-col select option[value=""] {
      color: var(--office-muted);
    }

    .save-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 16px;
    }

    .saved-msg {
      color: var(--green);
      font-size: 12px;
      font-weight: 600;
    }

    .subs-row {
      background: var(--office-panel);
      border: 1px solid var(--office-border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .subs-row.active {
      border-color: var(--status-orange);
      background: #FDF3EA;
    }

    .subs-row.vacant {
      border-color: var(--status-red);
      background: #FDF2F1;
    }

    .subs-row-head {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .subs-time {
      font: 700 11px/1 monospace;
      color: var(--office-muted);
      width: 90px;
    }

    .roster-add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .roster-add-row .field-input {
      flex: 1;
      min-width: 130px;
    }

    .roster-table-head,
    .roster-table-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1.4fr 1fr 32px;
      gap: 8px;
      padding: 9px 14px;
      align-items: center;
      font-size: 13px;
    }

    .roster-table-head {
      background: #EFEEE8;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--office-muted);
      border-radius: 8px 8px 0 0;
    }

    .roster-table-row {
      border-top: 1px solid var(--office-border);
      background: #fff;
    }

    .roster-table {
      border: 1px solid var(--office-border);
      border-radius: 10px;
      overflow: hidden;
    }

    .mono {
      font-family: monospace;
    }

    .chip {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .chip-green {
      background: rgba(71, 184, 129, .15);
      color: #1c7a4d;
    }

    .chip-muted {
      background: #EFEEE8;
      color: var(--office-muted);
    }

    .log-summary {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .log-summary-card {
      flex: 1;
      border-radius: 10px;
      padding: 14px;
    }

    .log-summary-num {
      font-size: 24px;
      font-weight: 800;
      display: block;
    }

    .absent-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .absent-chip {
      background: #FDF2F1;
      color: #a5372e;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .settings-note {
      color: var(--office-muted);
      font-size: 13px;
      line-height: 1.6;
      max-width: 560px;
    }

    /* ---- Modal (face enrollment) ---- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(18, 24, 42, .55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal-card {
      background: #fff;
      border-radius: 14px;
      padding: 22px;
      max-width: 440px;
      width: 92%;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    @media (max-width:640px) {
      .field-row {
        flex-direction: column;
      }

      .roster-table-head,
      .roster-table-row {
        grid-template-columns: 1fr;
        gap: 2px;
      }
    }

    /* ---- Custom select (replaces the browser's native, unstylable option list) ---- */
    .cs-wrap {
      position: relative;
    }

    .cs-native {
      position: absolute !important;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .cs-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
    }

    .cs-trigger-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cs-caret {
      width: 13px;
      height: 13px;
      stroke: #928A6C;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      transition: transform .15s ease;
    }

    .cs-wrap.open .cs-caret {
      transform: rotate(180deg);
      stroke: var(--office-accent);
    }

    .cs-wrap.open .cs-trigger {
      border-color: var(--office-accent) !important;
      box-shadow: 0 0 0 3px rgba(217, 102, 43, .15) !important;
    }

    .cs-list {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1.5px solid var(--office-border);
      border-radius: 14px;
      box-shadow: 0 16px 34px rgba(20, 27, 49, .2);
      padding: 6px;
      max-height: 230px;
      overflow-y: auto;
      z-index: 80;
      display: none;
    }

    .cs-wrap.open .cs-list {
      display: block;
    }

    .cs-option {
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      color: var(--office-ink);
      cursor: pointer;
      transition: background .12s ease, color .12s ease;
    }

    .cs-option:hover {
      background: #F6EFDD;
    }

    .cs-option.active {
      background: linear-gradient(135deg, var(--office-accent), var(--amber));
      color: #fff;
    }

    .cs-option.disabled {
      color: var(--office-muted);
      cursor: default;
      opacity: .55;
      pointer-events: none;
    }

    .notice-clickable {
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .notice-clickable:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .07);
    }

    .notice-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(18, 24, 32, .48);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      z-index: 9999;
    }

    .notice-modal {
      width: auto;
      max-width: min(720px, 100%);
      min-width: 320px;
      max-height: 90vh;
      overflow: auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .22);
      position: relative;
      padding: 24px;
    }

    .notice-modal-close {
      position: absolute;
      right: 14px;
      top: 12px;
      border: 0;
      background: transparent;
      font-size: 25px;
      line-height: 1;
      cursor: pointer;
      color: #68707b;
    }

    .notice-modal-title {
      font-size: 21px;
      font-weight: 800;
      margin: 0 38px 7px 0;
    }

    .notice-modal-meta {
      font-size: 12px;
      color: #727985;
      margin-bottom: 16px;
    }

    .notice-modal-body {
      font-size: 14px;
      line-height: 1.65;
      color: #252a31;
      white-space: pre-wrap;
    }

    .notice-modal img {
      display: block;
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 10px;
      margin: 14px auto;
    }
  </style>

  <style id="edge-password-preview-fix">
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
      display: none;
    }
  </style>

    /* ---- Custom select enhancement -----------------------------------------
       Native <select> option lists are drawn by the OS/browser and can't be
       restyled (no rounded corners, no custom hover, etc). Rather than touch
       every render() call site, a MutationObserver watches #app and wraps any
       freshly-rendered <select> in a fully-stylable dropdown built from divs.
       The original <select> stays in the DOM (invisibly) as the source of
       truth, so all existing .value / .onchange wiring keeps working as-is —
       the custom UI just drives it via a synthetic "change" event.
    ========================================================================= */
    function enhanceSelects(root) {
      (root || document).querySelectorAll("select:not([data-cs-enhanced])").forEach(sel => {
        sel.dataset.csEnhanced = "1";
        buildCustomSelect(sel);
      });
    }

    function buildCustomSelect(sel) {
      const origClass = sel.className;
      const wrap = document.createElement("div");
      wrap.className = "cs-wrap";
      if (sel.style.flex) wrap.style.flex = sel.style.flex;
      if (sel.style.minWidth) wrap.style.minWidth = sel.style.minWidth;
      if (sel.style.width) wrap.style.width = sel.style.width;
      sel.parentNode.insertBefore(wrap, sel);
      wrap.appendChild(sel);
      sel.classList.add("cs-native");
      sel.tabIndex = -1;

      const trigger = document.createElement("button");
      trigger.type = "button";
      trigger.className = (origClass ? origClass + " " : "") + "cs-trigger";
      // An explicit inline width on the source <select> (e.g. "width:auto" so it hugs its
      // label text instead of filling the row) needs to land on the trigger itself, since
      // .field-input's width:100% would otherwise fight an auto-width wrapper.
      if (sel.style.width) trigger.style.width = sel.style.width;
      trigger.innerHTML = `<span class="cs-trigger-label"></span><svg class="cs-caret" viewBox="0 0 20 20"><polyline points="5 8 10 13 15 8"/></svg>`;

      const list = document.createElement("div");
      list.className = "cs-list";

      function syncLabel() {
        const opt = sel.options[sel.selectedIndex];
        trigger.querySelector(".cs-trigger-label").textContent = opt ? opt.textContent : "";
      }
      function buildList() {
        list.innerHTML = "";
        [...sel.options].forEach((opt, i) => {
          const item = document.createElement("div");
          item.className = "cs-option" + (i === sel.selectedIndex ? " active" : "") + (opt.disabled ? " disabled" : "");
          item.textContent = opt.textContent;
          item.onclick = () => {
            if (opt.disabled) return;
            sel.selectedIndex = i;
            syncLabel();
            closeList();
            sel.dispatchEvent(new Event("change", { bubbles: true }));
          };
          list.appendChild(item);
        });
      }
      function onDocClick(e) { if (!wrap.contains(e.target)) closeList(); }
      function onKey(e) { if (e.key === "Escape") closeList(); }
      function openList() { buildList(); wrap.classList.add("open"); document.addEventListener("mousedown", onDocClick); document.addEventListener("keydown", onKey); }
      function closeList() { wrap.classList.remove("open"); document.removeEventListener("mousedown", onDocClick); document.removeEventListener("keydown", onKey); }

      trigger.onclick = () => { wrap.classList.contains("open") ? closeList() : openList(); };

      wrap.appendChild(trigger);
      wrap.appendChild(list);
      syncLabel();
    }

    // A stable default code is derived from the classId itself so every classroom already
    // has one even before Super Admin ever opens Settings; Settings can view (and override) them.
    function hashCode(str) { let h = 0; for (let i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) >>> 0; } return h; }
    function defaultClassroomCode(classId) { return String(1000 + (hashCode(classId) % 9000)); }

    /* =========================================================================
       TEACHERS / PERIOD STATUS
       Status color meaning is the same everywhere: green = running normally,
       orange = covered by an assigned substitute, yellow = covered via an
       approved exchange with another teacher, red = the usual teacher can't
       teach it (either on leave or on duty elsewhere) and it still has no
       coverage assigned.
    
       A teacher's daily attendance is one of three states:
         - "present": in school and free to teach / available as a substitute.
         - "duty":    in school, but occupied with something else (exam duty, a
                      meeting, etc.) — can't teach their own periods and can't
                      be picked as a substitute either.
         - "absent":  on leave, not in school at all.
    ========================================================================= */
    async function getTeachers() { return await storeGet("teachers", []); }
    async function getTeacherAttendance(dateKey) { return await storeGet(`teacherAttendance:${dateKey}`, {}); }

    // Names (not ids) of teachers marked absent on a date — periods are matched by teacher
    // name since routine periods only store a free-text teacher name, not a teacher id.
    async function getAbsentTeacherNames(dateKey) {
      const teachers = await getTeachers();
      const attendance = await getTeacherAttendance(dateKey);
      const absent = new Set();
      teachers.forEach(t => { if (attendance[t.id] === "absent") absent.add(t.name.trim().toLowerCase()); });
      return absent;
    }

    // Ids are the reliable link (periods set via the routine editor's teacher dropdown store
    // teacherId); names remain a fallback for older/free-text periods that predate that link.
    async function getAbsentTeacherIds(dateKey) {
      const teachers = await getTeachers();
      const attendance = await getTeacherAttendance(dateKey);
      const absent = new Set();
      teachers.forEach(t => { if (attendance[t.id] === "absent") absent.add(t.id); });
      return absent;
    }

    // Same idea, but for teachers marked "on duty" — present at school, unavailable to teach.
    async function getDutyTeacherNames(dateKey) {
      const teachers = await getTeachers();
      const attendance = await getTeacherAttendance(dateKey);
      const duty = new Set();
      teachers.forEach(t => { if (attendance[t.id] === "duty") duty.add(t.name.trim().toLowerCase()); });
      return duty;
    }

    async function getDutyTeacherIds(dateKey) {
      const teachers = await getTeachers();
      const attendance = await getTeacherAttendance(dateKey);
      const duty = new Set();
      teachers.forEach(t => { if (attendance[t.id] === "duty") duty.add(t.id); });
      return duty;
    }

    // ---- Split periods -------------------------------------------------
    // A period can be divided into two teaching groups (e.g. an elective split
    // within one class), each with its own subject and teacher — group 1 uses
    // the period's normal subject/teacher/teacherId fields, group 2 uses
    // subject2/teacher2/teacherId2 and only exists when period.split is true.
    // periodGroups() always returns at least one group, so every call site
    // below works identically whether or not a period is split.
    function periodGroups(p) {
      const groups = [{ subject: p.subject, teacher: p.teacher, teacherId: p.teacherId || null, slot: 1 }];
      if (p.split) groups.push({ subject: p.subject2, teacher: p.teacher2, teacherId: p.teacherId2 || null, slot: 2 });
      return groups;
    }

    function unavailableReasonForGroup(g, absentIds, absentNames, dutyIds, dutyNames) {
      if (g.teacherId) {
        if (absentIds.has(g.teacherId)) return "absent";
        if (dutyIds.has(g.teacherId)) return "duty";
        return null;
      }
      if (g.teacher) {
        const key = g.teacher.trim().toLowerCase();
        if (absentNames.has(key)) return "absent";
        if (dutyNames.has(key)) return "duty";
      }
      return null;
    }

    // Per-group availability for a period, so a display can note that one
    // teacher of a split period is out without treating the whole period as
    // vacant.
    function periodGroupAvailability(period, absentIds, absentNames, dutyIds, dutyNames) {
      return periodGroups(period).map(g => ({ ...g, reason: unavailableReasonForGroup(g, absentIds || new Set(), absentNames || new Set(), dutyIds || new Set(), dutyNames || new Set()) }));
    }

    // Joined teacher name(s) for a period — "Ms. Sharma" normally, or
    // "Ms. Sharma & Mr. Thapa" for a split period.
    function periodTeachersLabel(period) {
      return periodGroups(period).map(g => g.teacher || "—").join(" & ");
    }

    // Which of a period's groups belongs to a given teacher (falls back to
    // the first/only group), so a teacher's own views can show just their
    // half of a split period.
    function teacherGroupInPeriod(period, teacher) {
      const groups = periodGroups(period);
      if (!teacher) return groups[0];
      return groups.find(g => (!!g.teacherId && g.teacherId === teacher.id) || (!!g.teacher && g.teacher.trim().toLowerCase() === teacher.name.trim().toLowerCase())) || groups[0];
    }

    // Escaped "Subject · Teacher" text for a period, joining both groups with
    // a "+" when split. Safe to drop straight into markup.
    function periodSubjectTeacherHtml(period) {
      return periodGroups(period).map(g => `${esc(g.subject || "")} · ${esc(g.teacher || "—")}`).join(' <span style="color:var(--office-muted);">+</span> ');
    }

    // Escaped label for a sub/exchange record's incoming subject+teacher(s) —
    // uses the record's own group snapshot when present (split exchanges
    // carry both teachers), otherwise falls back to its single subTeacher.
    function subGroupsHtml(sub, fallbackPeriod) {
      if (sub && Array.isArray(sub.groups) && sub.groups.length) {
        return sub.groups.map(g => `${esc(g.subject || fallbackPeriod.subject || "")} · ${esc(g.teacher || "—")}`).join(' <span style="color:var(--office-muted);">+</span> ');
      }
      return `${esc((sub && sub.subSubject) || fallbackPeriod.subject)} · ${esc(sub && sub.subTeacher)}`;
    }

    // Why a period's usual teacher(s) can't teach it, if at all — "absent" |
    // "duty" | null. For a split period this only returns non-null when
    // EVERY group's teacher is unavailable — one absent teacher out of two
    // never makes the period look vacant to anyone.
    function unavailableReasonForPeriod(period, absentIds, absentNames, dutyIds, dutyNames) {
      const groups = periodGroupAvailability(period, absentIds, absentNames, dutyIds, dutyNames);
      if (!groups.every(g => g.reason)) return null;
      return groups.some(g => g.reason === "absent") ? "absent" : "duty";
    }

    // Plain yes/no version for call sites that just need to know whether a period is vacant.
    function isTeacherAbsentForPeriod(period, absentIds, absentNames, dutyIds, dutyNames) {
      return !!unavailableReasonForPeriod(period, absentIds, absentNames, dutyIds || new Set(), dutyNames || new Set());
    }

    // Returns {status, label, reason?} for a single class period, given any substitution/
    // exchange record for it and the absent/on-duty teacher sets for that date. "reason" is
    // only set when status is "empty", and is "absent" or "duty".
    function computePeriodStatus(period, sub, absentNames, absentIds, dutyNames, dutyIds) {
      if (sub && sub.type === "exchange") return { status: "exchange", label: "EXCHANGE" };
      if (sub) return { status: "substitute", label: "SUBSTITUTE" };
      const reason = unavailableReasonForPeriod(period, absentIds || new Set(), absentNames || new Set(), dutyIds || new Set(), dutyNames || new Set());
      if (reason) return { status: "empty", label: "VACANT", reason };
      return { status: "normal", label: "ACTIVE" };
    }

    // Set of classIds where a given teacher has at least one period, anywhere in the week —
    // used to decide which OTHER teachers should even be told about a vacancy (see
    // teachersShareClass below).
    async function classesTaughtByTeacher(teacherId) {
      const set = new Set();
      for (const c of CLASSES) {
        const week = await storeGet(`routine:${c.id}`, defaultWeek());
        for (const d of DAYS) {
          const dd = week[d];
          if (!dd || dd.off) continue;
          if (dd.periods.some(p => p.kind === "class" && (p.teacherId === teacherId || (p.split && p.teacherId2 === teacherId)))) { set.add(c.id); break; }
        }
      }
      return set;
    }

    // Two teachers "share classes" if there's any overlap between the sets of classes they
    // each teach somewhere in the week — this gates which teachers get notified about a
    // vacancy caused by someone else's absence.
    async function teachersShareClass(teacherIdA, teacherIdB) {
      if (!teacherIdA || !teacherIdB) return false;
      const [a, b] = await Promise.all([classesTaughtByTeacher(teacherIdA), classesTaughtByTeacher(teacherIdB)]);
      for (const c of a) if (b.has(c)) return true;
      return false;
    }

    async function getRequests() { return await storeGet("periodRequests", []); }
    async function saveRequests(list) { await storeSet("periodRequests", list); }

    async function removePeriodRequest(requestId) {
      const list = await getRequests();
      await saveRequests(list.filter(r => r.id !== requestId));
    }

    async function teacherIsAbsent(teacherId, dateKey = todayKey()) {
      const attendance = await getTeacherAttendance(dateKey);
      return !!teacherId && attendance[teacherId] === "absent";
    }

    async function getExams() { return await storeGet("examSchedule", []); }
    async function saveExams(list) { await storeSet("examSchedule", list); }

    async function getNotices() { return await storeGet("notices", []); }
    async function saveNotices(list) { await storeSet("notices", list); }

    // A notice applies to a viewer if it's for "all", or if it matches the viewer's audience
    // AND (it has no specific targets, meaning "everyone in that audience", OR the viewer's
    // own id — classId for a classroom board, teacherId for a teacher — is one of the targets).
    function noticeAppliesTo(n, audience, contextId) {
      if (n.audience === "all") return true;
      if (n.audience !== audience) return false;
      const targets = audience === "classroom" ? n.classIds : n.teacherIds;
      if (!targets || targets.length === 0) return true;
      return !!contextId && targets.includes(contextId);
    }

    // Shared notice bell dropdown used by both the classroom board and the teacher portal —
    // audience is "classroom" or "staff"; contextId is the viewer's own classId/teacherId,
    // used to filter out notices targeted at other grades/teachers. Notices marked "all"
    // always show to both.
    async function toggleNoticePanel(audience, contextId) {
      const existing = document.getElementById("notice-panel-el");
      if (existing) { existing.remove(); return; }
      const notices = (await getNotices()).filter(n => noticeAppliesTo(n, audience, contextId)).sort((a, b) => b.createdAt - a.createdAt);
      const panel = document.createElement("div");
      panel.id = "notice-panel-el";
      panel.className = "notice-panel";
      panel.innerHTML = `
    <div style="font:800 12px/1 var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--office-muted);margin-bottom:10px;">Notices</div>
    ${notices.length ? notices.map(n => `
      <div class="notice-item notice-clickable" data-notice-id="${esc(n.id)}">
        <span class="notice-audience">${esc(n.audience)}</span>
        <div class="notice-subject">${esc(getNoticeSubject(n))}</div>
        <div class="notice-preview">Click to read the full notice</div>
      </div>`).join("") : `<div class="panel-empty">No notices right now.</div>`}
  `;
      document.body.appendChild(panel);
      setTimeout(() => {
        document.addEventListener("click", function closeOnce(e) {
          if (!panel.contains(e.target)) { panel.remove(); document.removeEventListener("click", closeOnce); }
        });
      }, 10);
    }

    async function refreshNoticeDot(audience, dotId, contextId) {
      const notices = (await getNotices()).filter(n => noticeAppliesTo(n, audience, contextId));
      const dot = document.getElementById(dotId);
      if (dot) dot.style.display = notices.length ? "block" : "none";
    }

    /* =========================================================================
       STORAGE
       Uses window.storage when available, otherwise browser localStorage
    ========================================================================= */

    async function storeGet(key, fallback) {
      try {
        // Use platform storage if available
        if (window.storage && typeof window.storage.get === "function") {
          const r = await window.storage.get(key, true);
          return r ? JSON.parse(r.value) : fallback;
        }

        // Normal browser fallback
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;

      } catch (e) {
        console.error("storage get failed:", key, e);
        return fallback;
      }
    }

    async function storeSet(key, value) {
      try {
        const json = JSON.stringify(value);

        // Use platform storage if available
        if (window.storage && typeof window.storage.set === "function") {
          await window.storage.set(key, json, true);
          return true;
        }

        // Normal browser fallback
        localStorage.setItem(key, json);
        return true;

      } catch (e) {
        console.error("storage set failed:", key, e);
        return false;
      }
    }

    /* =========================================================================
       FACE RECOGNITION (Human.js — on-device detection + embedding)
       Attendance requires the student's ID AND a face check against ONLY that
       one student's stored face (1:1 verification, not a search across the
       whole roster — faster and can't cross-match two similar-looking kids).
       Approval is on face match alone, using the detection model's own
       anti-spoof score to fast-reject an obvious photo or screen.
    ========================================================================= */
    let human = null;
    let humanReady = false;
    let humanError = null;

    async function initHuman() {
      try {
        human = new Human.default({
          modelBasePath: "https://cdn.jsdelivr.net/npm/@vladmandic/human@3.3.6/models/",
          face: {
            enabled: true, detector: { rotation: true, maxDetected: 1, return: true }, mesh: { enabled: true }, iris: { enabled: false },
            description: { enabled: true }, emotion: { enabled: false }, antispoof: { enabled: true }, liveness: { enabled: true }
          },
          body: { enabled: false }, hand: { enabled: false }, object: { enabled: false }, gesture: { enabled: false }, segmentation: { enabled: false }
        });
        const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("timed out — check your internet connection")), 25000));
        await Promise.race([human.load(), timeout]);
        await Promise.race([human.warmup(), timeout]);
        humanReady = true;
      } catch (e) {
        humanError = e?.message || "Failed to load face model";
        console.error("Human init failed", e);
      }
    }
    initHuman(); // kick off in the background as soon as the page loads

    /* ---- Startup splash: show project name + logo briefly on load ---- */
    function hideSplash() {
      const s = document.getElementById("splash");
      if (!s || s.classList.contains("splash-hide")) return;
      s.classList.add("splash-hide");
      setTimeout(() => { s.remove(); }, 650);
    }
    (function initSplash() {
      const logo = document.getElementById("splash-logo");
      if (logo) logo.src = LOGO_DATA_URI;

    function cosineSim(a, b) {
      let dot = 0, na = 0, nb = 0;
      for (let i = 0; i < a.length; i++) { dot += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
      return dot / (Math.sqrt(na) * Math.sqrt(nb) || 1);
    }
    const FACE_THRESHOLD = 0.62;       // 1:1 match confidence needed against the stored student face
    const ANTISPOOF_THRESHOLD = 0.55;  // below this, the model itself thinks it's looking at a photo/screen
    const ANTISPOOF_FAIL_THRESHOLD = 0.3; // below this, reject immediately
    const MATCH_WINDOW_MS = 6000;      // how long a student has to be matched before the attempt times out

    // Waits until the video element actually has pixels to read — calling detect() before
    // this is ready is the most common reason a scan silently never finds anything.
    function waitForVideoReady(videoEl) {
      return new Promise((resolve) => {
        if (videoEl.readyState >= 2 && videoEl.videoWidth > 0) return resolve();
        const check = () => { if (videoEl.videoWidth > 0) resolve(); else setTimeout(check, 150); };
        videoEl.addEventListener("loadeddata", check, { once: true });
        setTimeout(check, 150);
      });
    }

    // Single detection pass — returns face presence, embedding, anti-spoof score, and head-pose
    // angles all together so the caller only pays the inference cost once per frame.
    async function detectFaceFull(videoEl) {
      if (!humanReady) return { hasFace: false };
      const result = await human.detect(videoEl);
      if (!result.face || !result.face.length) return { hasFace: false };
      const f = result.face.reduce((a, b) => (a.box[2] * a.box[3] > b.box[2] * b.box[3] ? a : b));
      return {
        hasFace: true,
        embedding: (f.embedding && f.embedding.length) ? Array.from(f.embedding) : null,
        antispoofScore: typeof f.real === "number" ? f.real : (typeof f.antispoof === "number" ? f.antispoof : null),
        yaw: f.rotation?.angle?.yaw ?? null,
        pitch: f.rotation?.angle?.pitch ?? null,
      };
    }

    /* ---- Login ---- */

      const pick = document.getElementById("pick-classroom");

      const office = document.getElementById("pick-office");

      const pickSuper = document.getElementById("pick-super");

      const back = document.getElementById("pin-back");

      async function tryPin() {
        const key = state.loginOfficeRole === "super" ? "office-pin-super" : "office-pin-daily";
        const fallback = state.loginOfficeRole === "super" ? "5678" : "1234";
        const real = await storeGet(key, fallback);
        if (input.value === real) {
          state.officeRole = state.loginOfficeRole; state.officeTab = state.loginOfficeRole === "super" ? "teachers" : "routine";
          state.screen = "office"; state.loginOfficeStep = null; render();
        } else {
          document.getElementById("pin-error").textContent = "Incorrect PIN";

      }
      if (submit) submit.onclick = tryPin;

      const tBack = document.getElementById("teacher-back");
      if (tBack) tBack.onclick = () => { state.loginShowTeacher = false; state.loginTeacherError = ""; render(); };

        const teachers = await getTeachers();
        const match = teachers.find(t => t.teacherId.trim().toLowerCase() === tId.value.trim().toLowerCase() && t.password === tPw.value);
